<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Xena</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #2e0854, #120324, #000); color: #fff; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; overflow: hidden; }
        .top-section { margin-top: 60px; }
        .logo-text { font-size: 32px; font-weight: bold; font-style: italic; letter-spacing: 1px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logo-icon { background: linear-gradient(135deg, #a855f7, #ec4899); width: 35px; height: 35px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .auth-container { width: 90%; max-width: 400px; padding: 20px; margin-bottom: 30px; }
        
        .btn-auth { width: 100%; padding: 14px; margin: 10px 0; border-radius: 30px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-google { background: #fff; color: #000; }
        .btn-phone { background: rgba(255, 255, 255, 0.15); color: #fff; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .btn-auth:hover { opacity: 0.9; transform: scale(0.98); }
        
        .other-methods { margin-top: 15px; font-size: 12px; color: #aaa; }
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .social-icon { width: 45px; height: 45px; border-radius: 50%; background: #1a103c; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        
        .terms { font-size: 11px; color: #888; margin-bottom: 20px; padding: 0 20px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .terms input { accent-color: #a855f7; }
        .terms a { color: #a855f7; text-decoration: none; }

        /* نموذج إدخال الاسم السريع عند الضغط */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #191438; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #3b2875; }
        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #444; background: #241d4f; color: #fff; box-sizing: border-box; }
        .modal-content button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="logo-text">
            <span class="logo-icon">🪐</span> Xena
        </div>
    </div>

    <div class="auth-container">
        <button class="btn-auth btn-google" onclick="quickLogin('مستخدم Google')">
            <span>🌐</span> سجل الدخول باستخدام Google
        </button>
        
        <button class="btn-auth btn-phone" onclick="openNameModal()">
            <span>📱</span> قم بتسجيل الدخول باستخدام رقم الهاتف
        </button>

        <div class="other-methods">الطريقة الأخرى لتسجيل دخول</div>

        <div class="social-icons">
            <div class="social-icon" onclick="quickLogin('مستخدم Snapchat')">👻</div>
            <div class="social-icon" onclick="quickLogin('مستخدم TikTok')">🎵</div>
            <div class="social-icon" onclick="quickLogin('مستخدم Facebook')">📘</div>
        </div>
    </div>

    <div class="terms">
        <input type="checkbox" id="termsCheck" checked>
        <span>لقد قرأت ووافقت على <a href="#">شروط الخدمة</a> وسياسة الخصوصية.</span>
    </div>

    <!-- نافذة منبثقة لإدخال الاسم عند اختيار الدخول -->
    <div class="modal hidden" id="nameModal">
        <div class="modal-content">
            <h3>تسجيل الدخول</h3>
            <p style="font-size: 12px; color: #aaa;">أدخل اسمك المستعار للمتابعة</p>
            <input type="text" id="modalUserName" placeholder="اكتب اسمك هنا..." />
            <button onclick="submitLogin()">دخول للغرف</button>
            <p style="font-size: 11px; color: #ef4444; cursor: pointer; margin-top: 10px;" onclick="closeModal()">إلغاء</p>
        </div>
    </div>

    <script>
        function openNameModal() {
            document.getElementById("nameModal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("nameModal").classList.add("hidden");
        }

        async function quickLogin(defaultName) {
            const name = prompt("أدخل اسمك المستعار:", defaultName);
            if(!name) return;
            executeLogin(name);
        }

        async function submitLogin() {
            const name = document.getElementById("modalUserName").value;
            if(!name) return alert("الرجاء إدخال الاسم");
            executeLogin(name);
        }

        async function executeLogin(userName) {
            const res = await fetch("/api/user/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userName })
            });
            const data = await res.json();
            if(data.success) {
                // حفظ المستخدم والانتقال للرئيسية أو الغرفة مباشرة
                localStorage.setItem("user", JSON.stringify(data.user));
                window.location.href = "/rooms.html"; // سنعرض صفحة الغرف
            } else {
                alert("فشل تسجيل الدخول");
            }
        }
    </script>
</body>
</html>
