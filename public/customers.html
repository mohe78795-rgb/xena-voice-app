<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العملاء | معجم لتجارة الدواجن</title><style>
:root{--green:#087f5b;--dark:#063b35;--gold:#d9a441;--bg:#f2f7f5}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#17322d}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;border-radius:0 0 22px 22px;padding:22px 20px;box-shadow:0 5px 18px #063b3530}.hero h1{margin:0;font-size:26px}.hero p{margin:7px 0 0;color:#d9eee8}.ticker{overflow:hidden;white-space:nowrap;background:#ffe8ae;color:#553b00;padding:9px;border-radius:12px;margin:12px 0;font-weight:bold}.ticker span{display:inline-block;padding-right:100%;animation:move 18s linear infinite}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav a,.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;text-decoration:none;cursor:pointer;font-weight:bold}.nav a.alt,.btn.alt{background:#fff;color:var(--green);border:1px solid #b7d8ce}.panel,.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #103b3020}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:#47645d}.field input{width:100%;padding:12px;border:1px solid #c9ddd6;border-radius:9px;font-size:15px}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.contact{background:#d9a441;color:#3b2900}.search{width:100%;padding:13px;border:1px solid #c9ddd6;border-radius:10px;font-size:16px}.card h3{margin:0 0 5px;color:var(--dark)}.meta{color:#607a72;font-size:13px}.edit{margin-top:12px;padding-top:12px;border-top:1px solid #e2eee9}.error{color:#a51d2d;background:#fff0f1;padding:12px;border-radius:10px}.ok{color:#075b42;background:#e7f8f0;padding:12px;border-radius:10px}@media(max-width:600px){.hero h1{font-size:21px}.wrap{padding:8px}}
</style></head><body><header class="hero"><div class="wrap"><h1>معجم لتجارة الدواجن</h1><p>إدارة العملاء والأرصدة والسقوف الائتمانية</p></div></header><div class="wrap"><div class="ticker"><span>ابتو مكس Abto mix للبرمجيات والحلول الذكيه والمصرفيه — اليمن صنعاء/ اب/البيضاء — تـ780425632 967+</span></div><nav class="nav"><a class="alt" href="/">الرئيسية</a><a href="/pdf.html">رفع PDF وتحديث الأرصدة</a></nav><section class="panel"><h2>إضافة عميل</h2><form id="add"><div class="fields"><div class="field"><label>رقم العميل</label><input name="customer_id" type="number" required></div><div class="field"><label>اسم العميل</label><input name="customer_name" required></div><div class="field"><label>رقم الهاتف</label><input name="phone" inputmode="tel"></div><div class="field"><label>سقف الائتمان</label><input name="credit_limit" type="number" min="0"></div></div><div class="actions"><button class="btn" type="submit">حفظ العميل</button><button class="btn contact" type="button" id="pick">اختيار من جهات الاتصال</button></div><p id="addmsg"></p></form></section><input id="q" class="search" placeholder="بحث بالاسم أو رقم العميل أو الهاتف"><div id="list">جارٍ تحميل العملاء...</div></div><script>
function $(s){return document.querySelector(s)}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function api(u,o){var r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الاتصال');return d}function formData(){var f=new FormData($('#add'));return {customer_id:f.get('customer_id'),customer_name:f.get('customer_name'),phone:f.get('phone'),credit_limit:f.get('credit_limit')}}
async function load(){try{var d=await api('/api/customers?q='+encodeURIComponent($('#q').value));$('#list').innerHTML=d.customers.map(function(c){return '<article class="card"><h3>'+esc(c.customer_name)+'</h3><div class="meta">رقم العميل: '+c.customer_id+' | الهاتف: '+esc(c.phone||'غير مضاف')+' | الرصيد: '+(c.current_balance==null?'غير مذكور':Number(c.current_balance).toLocaleString('en-US'))+'</div><div class="edit fields"><div class="field"><label>الاسم</label><input id="n'+c.customer_id+'" value="'+esc(c.customer_name)+'"></div><div class="field"><label>الهاتف</label><input id="p'+c.customer_id+'" value="'+esc(c.phone||'')+'" inputmode="tel"></div><div class="field"><label>السقف</label><input id="l'+c.customer_id+'" value="'+(c.credit_limit==null?'':c.credit_limit)+'" type="number"></div><div class="actions"><label><input id="s'+c.customer_id+'" type="checkbox" '+(c.suspended?'checked':'')+'> إيقاف العميل</label><button class="btn" onclick="save('+c.customer_id+')">حفظ التعديل</button></div></div></article>}).join('')||'<div class="panel">لا يوجد عملاء.</div>'}catch(e){$('#list').innerHTML='<div class="error">تعذر تحميل العملاء: '+esc(e.message)+'</div>'}}
async function save(id){try{await api('/api/customers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:$('#n'+id).value,phone:$('#p'+id).value,credit_limit:$('#l'+id).value,suspended:$('#s'+id).checked})});load()}catch(e){alert(e.message)}}
$('#pick').onclick=async function(){if(!navigator.contacts||!navigator.contacts.select){alert('اختيار جهات الاتصال غير مدعوم في هذا المتصفح. اكتب الاسم والرقم يدويًا.');return}try{var c=(await navigator.contacts.select(['name','tel'],{multiple:false}))[0];if(c){$('#add [name="customer_name"]').value=(c.name&&c.name[0])||'';$('#add [name="phone"]').value=(c.tel&&c.tel[0])||'';$('#add [name="customer_id"]').focus()}}catch(e){if(e.name!=='AbortError')alert('تعذر قراءة جهة الاتصال')}};
$('#add').onsubmit=async function(e){e.preventDefault();try{await api('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData())});$('#addmsg').className='ok';$('#addmsg').textContent='تم حفظ العميل في قاعدة البيانات السحابية';e.target.reset();load()}catch(e){$('#addmsg').className='error';$('#addmsg').textContent=e.message}};$('#q').oninput=load;load();
</script></body></html>
