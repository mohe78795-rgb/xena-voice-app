<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عملاء معجم</title><style>
:root{--g:#087f5b;--d:#063b35;--gold:#d9a441;--red:#c62828;--bg:#eef5f2;--line:#d7e7e1}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#17322d}.wrap{max-width:1120px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;padding:22px 18px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px #063b3530}.hero h1{margin:0;font-size:25px}.hero p{margin:6px 0 0;color:#dcefe9}.searchbox{background:linear-gradient(135deg,var(--d),var(--g));padding:10px;border-radius:14px;box-shadow:0 3px 12px #103b3020;margin-bottom:10px}.searchbox input{width:100%;padding:14px;border:1px solid #bcd8ce;border-radius:10px;font-size:16px}.ticker{overflow:hidden;white-space:nowrap;background:#ffe8ae;color:#553b00;padding:9px;border-radius:12px;margin:10px 0;font-weight:bold}.ticker span{display:inline-block;padding-right:100%;animation:move 18s linear infinite}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.nav a,.tab{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;text-decoration:none;cursor:pointer;font-weight:bold}.nav a.alt,.tab.alt{background:#fff;color:var(--g);border:1px solid #b7d8ce}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{background:#fff;color:var(--g);border:1px solid #b7d8ce}.tab.active{background:var(--g);color:#fff}.count{font-size:12px;opacity:.8}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 4px 15px #103b3020;transition:.2s}.card.has-phone{background:#f8fcfa}.card.suspended{opacity:.64;border-color:#e7a5a5}.top{display:flex;align-items:stretch;justify-content:space-between;gap:12px}.identity{flex:1}.identity h2{margin:0;color:var(--d);font-size:21px}.id{color:#607a72;font-size:13px;margin-top:5px}.balance{min-width:170px;background:linear-gradient(135deg,#e4f6ee,#c8ebdc);border-radius:14px;padding:10px 14px;text-align:center}.balance small{display:block;color:#3e7060;font-size:12px}.balance strong{display:block;color:var(--d);font-size:24px;margin-top:5px}.fields{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-top:14px}.field{position:relative}.field label{display:block;color:#56736a;font-size:13px;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #bfd9cf;border-radius:10px;font-size:16px;background:#fff}.phone-wrap{position:relative}.phone-wrap input{padding-left:48px}.contact-icon{position:absolute;left:6px;top:5px;width:38px;height:38px;border:0;border-radius:8px;background:#fff1c9;color:#694e00;font-size:21px;cursor:pointer}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.save{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:bold;cursor:pointer}.stop{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:bold;cursor:pointer}.stop.on{background:#68756f}.empty,.error{background:#fff;padding:18px;border-radius:14px;text-align:center}.error{color:#a51d2d}.toast{position:fixed;bottom:20px;right:20px;left:20px;max-width:520px;margin:auto;padding:15px 18px;border-radius:12px;color:#fff;text-align:center;font-weight:bold;z-index:10;box-shadow:0 5px 20px #0003}.toast.ok{background:#087f5b}.toast.bad{background:#b42318}@media(max-width:600px){.top{flex-direction:column}.balance{min-width:0}.fields{grid-template-columns:1fr}.hero h1{font-size:21px}}
</style></head><body><header class="hero"><div class="wrap"><h1>معجم لتجارة الدواجن</h1><p>بيانات العملاء والأرصدة والسقوف</p></div></header><main class="wrap"><div class="ticker"><span>ابتومكس للحلول الذكيه — 780425632 967+</span></div><div class="searchbox"><input id="q" placeholder="بحث باسم العميل أو رقم العميل أو الهاتف"></div><div class="tabs"><button class="tab active" data-filter="all">كل الزبائن <span class="count" id="allCount"></span></button><button class="tab" data-filter="missing">لم تتم إضافة أرقام <span class="count" id="missingCount"></span></button><button class="tab" data-filter="has">تمت إضافة أرقام <span class="count" id="hasCount"></span></button></div><section id="list">جارٍ تحميل العملاء...</section></main><div id="toast" hidden></div><script>
function $(s){return document.querySelector(s)}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}})}function money(x){return x==null?'غير مذكور':Number(x).toLocaleString('en-US')}async function api(u,o){var r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'فشل الاتصال');return d}var all=[],filter='all';function toast(msg,ok){var t=$('#toast');t.textContent=msg;t.className='toast '+(ok?'ok':'bad');t.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(function(){t.hidden=true},3000)}
function render(){var q=($('#q').value||'').toLowerCase().trim();var rows=all.filter(function(c){var hay=(c.customer_name+' '+c.customer_id+' '+(c.phone||'')).toLowerCase();var f=filter==='missing'?!c.phone:filter==='has'?!!c.phone:true;return f&&(!q||hay.indexOf(q)>=0)});$('#allCount').textContent='('+all.length+')';$('#missingCount').textContent='('+all.filter(function(c){return !c.phone}).length+')';$('#hasCount').textContent='('+all.filter(function(c){return !!c.phone}).length+')';$('#list').innerHTML=rows.map(function(c){var active=c.suspended?'on':'';var cls='card '+(c.phone?'has-phone ':'')+(c.suspended?'suspended':'');return '<article class="'+cls+'"><div class="top"><div class="identity"><h2>'+esc(c.customer_name)+'</h2><div class="id">رقم العميل: <b>'+c.customer_id+'</b></div></div><div class="balance"><small>الرصيد الحالي</small><strong>'+money(c.current_balance)+'</strong></div></div><div class="fields"><div class="field"><label>رقم الهاتف</label><div class="phone-wrap"><input id="p'+c.customer_id+'" value="'+esc(c.phone||'')+'" inputmode="tel" placeholder="أدخل الرقم"><button class="contact-icon" title="اختيار من جهات الاتصال" onclick="pickPhone('+c.customer_id+')">☎</button></div></div><div class="field"><label>سقف العميل المحدد</label><input id="l'+c.customer_id+'" value="'+(c.credit_limit==null?'':c.credit_limit)+'" type="number" min="0" placeholder="بدون سقف"></div></div><div class="actions"><button class="save" onclick="save('+c.customer_id+')">حفظ البيانات</button><button class="stop '+active+'" onclick="toggleStop('+c.customer_id+','+(c.suspended?'false':'true')+')">'+(c.suspended?'إلغاء التوقيف':'توقيف')+'</button></div></article>'}).join('')||'<div class="empty">لا يوجد زبائن في هذا القسم.</div>'}
async function load(){try{var d=await api('/api/customers');all=d.customers||[];render()}catch(e){$('#list').innerHTML='<div class="error">تعذر تحميل العملاء: '+esc(e.message)+'</div>';toast(e.message,false)}}async function save(id){try{await api('/api/customers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('#p'+id).value,credit_limit:$('#l'+id).value,suspended:document.querySelector('.card input#p'+id).closest('.card').querySelector('.stop').classList.contains('on')})});toast('تم حفظ بيانات العميل بنجاح',true);load()}catch(e){toast('فشل حفظ البيانات: '+e.message,false)}}async function toggleStop(id,state){try{await api('/api/customers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({suspended:state})});toast(state?'تم توقيف العميل':'تم إلغاء توقيف العميل',true);load()}catch(e){toast('فشل تحديث حالة العميل: '+e.message,false)}}async function pickPhone(id){if(!navigator.contacts||!navigator.contacts.select){toast('اختيار جهات الاتصال غير مدعوم؛ اكتب الرقم يدويًا',false);return}try{var x=await navigator.contacts.select(['tel'],{multiple:false});if(x&&x[0]&&x[0].tel&&x[0].tel[0]){$('#p'+id).value=x[0].tel[0];await save(id)}}catch(e){if(e.name!=='AbortError')toast('تعذر جلب جهة الاتصال',false)}}document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');filter=b.getAttribute('data-filter');render()}});$('#q').oninput=render;load();
</script></body></html>
