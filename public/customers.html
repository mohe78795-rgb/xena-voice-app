<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العملاء</title><style>body{font-family:Arial;direction:rtl;background:#f4f7f5;margin:auto;max-width:1000px;padding:18px}input,button{padding:10px;margin:4px;border:1px solid #ccd;border-radius:8px}button{background:#087f5b;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;background:white;padding:12px;margin:10px 0;border-radius:12px}.card{background:#fff;padding:12px;margin:8px 0;border-radius:12px;box-shadow:0 1px 5px #ddd}.muted{color:#667}a{color:#087f5b}</style><a href="/">الرئيسية</a><h1>إدارة العملاء</h1><form id="add" class="grid"><input name="customer_id" type="number" placeholder="رقم العميل" required><input name="customer_name" placeholder="اسم العميل" required><input name="phone" placeholder="رقم الهاتف"><input name="credit_limit" type="number" placeholder="سقف الائتمان"><button>إضافة عميل</button></form><input id="q" placeholder="بحث بالاسم أو الرقم" style="width:95%"><div id="list">جارٍ التحميل...</div><script>function $(x){return document.querySelector(x)}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}async function api(u,o){var r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'فشل الاتصال');return d}async function load(){try{var d=await api('/api/customers?q='+encodeURIComponent($('#q').value));$('#list').innerHTML=d.customers.map(function(c){var balance=c.current_balance==null?'غير معروف':c.current_balance;var limit=c.credit_limit==null?'':c.credit_limit;return '<div class="card"><b>'+esc(c.customer_name)+'</b> <span class="muted">#'+c.customer_id+' — الرصيد: '+balance+'</span><div class="grid"><input id="n'+c.customer_id+'" value="'+esc(c.customer_name)+'" placeholder="الاسم"><input id="p'+c.customer_id+'" value="'+esc(c.phone||'')+'" placeholder="الهاتف"><input id="l'+c.customer_id+'" value="'+limit+'" type="number" placeholder="السقف"><label><input id="s'+c.customer_id+'" type="checkbox" '+(c.suspended?'checked':'')+'> إيقاف العميل</label><button onclick="save('+c.customer_id+')">حفظ التعديل</button></div></div>'}).join('')||'لا يوجد عملاء'}catch(e){$('#list').innerHTML='<b style="color:#b42318">تعذر تحميل العملاء: '+esc(e.message)+'</b>'}}async function save(id){try{await api('/api/customers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:$('#n'+id).value,phone:$('#p'+id).value,credit_limit:$('#l'+id).value,suspended:$('#s'+id).checked})});alert('تم الحفظ في قاعدة البيانات السحابية');load()}catch(e){alert(e.message)}};$('#add').onsubmit=async function(e){e.preventDefault();try{var f=new FormData(e.target),b={customer_id:f.get('customer_id'),customer_name:f.get('customer_name'),phone:f.get('phone'),credit_limit:f.get('credit_limit')};await api('/api/customers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});e.target.reset();load()}catch(x){alert(x.message)}};$('#q').oninput=load;load()</script>
