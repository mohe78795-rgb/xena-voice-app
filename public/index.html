<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجم لتربية وتسويق الدواجن - النظام الشامل بملء الشاشة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-sizing: border-box; }
        body { background-color: #0b111e; color: #fff; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b111e; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .gold-frame-btn {
            background: linear-gradient(135deg, #161f32 0%, #0b0f19 100%);
            border: 2px solid #d4af37;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
            position: relative;
        }
        .gold-frame-btn:hover {
            border-color: #f3e5ab;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .manager-home-container { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        .chart-container-box { background-color: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; height: 280px; flex-shrink: 0; position: relative; }
        .grid-buttons-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-dashboard-btn {
            background-color: #131c31; border: 1px solid #facc15; color: #facc15;
            padding: 14px 10px; border-radius: 12px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-dashboard-btn:hover { background-color: #facc15; color: #0b111e; }
        .full-width-btn { grid-column: span 2; }
    </style>
</head>
<body class="text-white min-h-screen w-full m-0 p-0 flex flex-col selection:bg-yellow-500 selection:text-black overflow-x-hidden">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="w-full min-h-screen bg-[#0d111a] flex items-center justify-center p-0 md:p-6">
        <div class="w-full min-h-screen md:min-h-fit md:max-w-xl bg-[#111827] md:rounded-3xl p-6 md:p-10 shadow-2xl border-0 md:border border-slate-800 relative flex flex-col justify-center overflow-hidden">
            <div class="absolute -top-12 -left-12 w-40 h-40 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-6 relative">
                <div class="w-20 h-20 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-700 shadow-inner overflow-hidden p-2">
                    <img src="https://i.postimg.cc/DWtX86v7/logo.png" alt="شعار الشركة" class="w-full h-full object-contain">
                </div>
                <h1 class="text-xl font-bold text-white mb-1">معجم لتربية وتسويق الدواجن</h1>
                <p class="text-[11px] text-yellow-400 font-semibold mb-0.5">Dictionary of Poultry Breeding and Marketing</p>
                <p class="text-slate-400 text-[10px]">الجمهورية اليمنية - محافظة البيضاء</p>
            </div>

            <form id="loginForm" class="space-y-4 relative max-w-md mx-auto w-full" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">اسم المستخدم / رقم الهاتف</label>
                    <input type="text" id="username" required class="w-full bg-[#0d111a] border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="أدخل رقم الهاتف أو اسم المستخدم">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-[#0d111a] border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-700 text-slate-950 font-bold py-3.5 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول للنظام
                </button>
            </form>

            <div class="mt-6 text-center border-t border-slate-800 pt-5 max-w-md mx-auto w-full space-y-2">
                <p class="text-slate-400 text-xs">ليس لديك حساب وموظف جديد أو عميل في المنظومة؟</p>
                <button onclick="document.getElementById('registerModal').classList.remove('hidden')"
                    class="w-full bg-slate-800 hover:bg-slate-700 text-yellow-400 hover:text-yellow-300 font-bold py-3.5 rounded-xl text-xs transition border border-slate-700 flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-user-plus text-sm"></i> إنشاء حساب جديد
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة تسجيل حساب جديد -->
    <div id="registerModal" class="hidden fixed inset-0 bg-[#0d111a] flex flex-col items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="w-full h-full max-w-full max-h-screen bg-[#0f172a] rounded-none p-6 md:p-12 shadow-2xl flex flex-col justify-center relative">
            <button onclick="document.getElementById('registerModal').classList.add('hidden')" class="absolute top-6 left-6 text-slate-400 hover:text-white text-xl bg-slate-800/60 w-10 h-10 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="max-w-md mx-auto w-full">
                <div class="text-center mb-6">
                    <h2 class="text-xl font-bold text-yellow-400 mb-1 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-id-card"></i> إنشاء حساب جديد في المنظومة
                    </h2>
                    <p class="text-slate-400 text-xs">الجمهورية اليمنية - محافظة البيضاء</p>
                </div>
                <form id="registerForm" class="space-y-4" onsubmit="handleRegister(event)">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم الكامل</label>
                        <input type="text" id="regName" placeholder="أدخل اسمك الكامل..." required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">رقم الهاتف</label>
                        <input type="text" id="regPhone" placeholder="07xxxxxxxx" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة السر</label>
                        <input type="password" id="regPassword" placeholder="••••••••" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-yellow-400 mb-1 font-bold">اختر صفتك / وظيفتك المعتمدة:</label>
                        <select id="regRole" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
                            <option value="" disabled selected>-- اختر تخصصك الوظيفي --</option>
                            <option value="warehouse">مدير مخازن</option>
                            <option value="marketer">مسوق مزارع</option>
                            <option value="accountant">محاسب</option>
                            <option value="admin">مدير عام (Admin)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-700 text-slate-950 font-bold py-3.5 rounded-xl text-sm mt-4 shadow-lg">
                        تسجيل الحساب في قاعدة البيانات
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم بملء الشاشة -->
    <div id="dashboardScreen" class="hidden w-full min-h-screen bg-[#0d111a] p-3 md:p-6 flex flex-col justify-between">
        <div class="w-full flex-1 flex flex-col">
            <div class="w-full border-b border-slate-800/80 pb-3 mb-4 bg-[#161f32]/60 px-4 py-3 rounded-2xl shadow-sm flex justify-between items-center">
                <div>
                    <h2 class="text-sm md:text-base font-bold text-white tracking-wide">معجم لتربية وتسويق الدواجن</h2>
                    <p class="text-[10px] text-yellow-400 font-medium">الجمهورية اليمنية - محافظة البيضاء</p>
                </div>
                <div id="userWelcomeBadge" class="text-xs text-yellow-400 font-bold bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700"></div>
            </div>
            <div id="tabContentContainer" class="w-full flex-1 space-y-4 custom-scrollbar flex flex-col items-center justify-center"></div>
        </div>

        <!-- شريط التنقل السفلي المحدث (الرئيسية، الفواتير، الطلبات، الرسائل، الحساب) -->
        <div class="w-full mt-4 pt-2 border-t border-slate-800 grid grid-cols-5 gap-1 bg-[#111827] p-2 rounded-2xl border border-slate-800 text-center shadow-lg">
            <button onclick="switchTab('home')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-yellow-400" data-nav="home"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] mt-1">الرئيسية</span></button>
            <button onclick="switchTab('tasks')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="tasks"><i class="fa-solid fa-file-invoice-dollar text-base"></i><span class="text-[10px] mt-1">الفواتير</span></button>
            <button onclick="switchTab('orders')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="orders"><i class="fa-solid fa-boxes-stacked text-base"></i><span class="text-[10px] mt-1">الطلبات</span></button>
            <button onclick="switchTab('messages')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="messages"><i class="fa-solid fa-comments text-base"></i><span class="text-[10px] mt-1">الرسائل</span></button>
            <button onclick="switchTab('account')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="account"><i class="fa-solid fa-user-gear text-base"></i><span class="text-[10px] mt-1">الحساب</span></button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) { loadDashboard(JSON.parse(savedUser)); }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    loadDashboard(data.user);
                } else {
                    alert(data.message || 'خطأ في بيانات الدخول');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالسيرفر');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password, role })
                });
                const data = await response.json();
                if (data.success) {
                    alert('✅ تم إنشاء الحساب بنجاح!');
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    document.getElementById('registerModal').classList.add('hidden');
                    loadDashboard(data.user);
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال');
            }
        }

        function loadDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('userWelcomeBadge').innerText = `${user.name} (${user.role === 'marketer' ? 'مسوق مزارع' : user.role})`;
            
            if(user.role === 'marketer') {
                switchTab('marketShipment');
            } else {
                switchTab('home');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function switchTab(tabName) {
            const user = JSON.parse(localStorage.getItem('currentUser')) || { role: 'warehouse' };
            const container = document.getElementById('tabContentContainer');
            document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('text-yellow-400'));

            if (tabName === 'home') {
                if (user.role === 'warehouse' || user.role === 'admin') {
                    container.innerHTML = getManagerHomeUI();
                    setTimeout(() => { initManagerChart(); }, 100);
                } else {
                    container.innerHTML = `<div class="p-8 text-center text-slate-400">مرحباً بك (${user.name}) في النظام الشامل.</div>`;
                }
            } else if (tabName === 'marketShipment') {
                fetchMarketShipmentData();
            } else if (tabName === 'tasks') {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">قسم الفواتير الشاملة جاهز.</div>`;
            } else if (tabName === 'orders') {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">قسم الطلبات والمخازن جاهز.</div>`;
            } else if (tabName === 'messages') {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">قسم الرسائل والمحادثات جاهز.</div>`;
            } else if (tabName === 'account') {
                container.innerHTML = `<div class="p-6 text-center text-slate-300"><h3>حساب المستخدم: ${user.name}</h3><p>الوظيفة: ${user.role}</p><p>الهاتف: ${user.phone}</p></div>`;
            }
        }

        // واجهة مدير المخازن (بدون زر مسؤول مزارع وبدون زر خروج)
        function getManagerHomeUI() {
            return `
                <div class="manager-home-container pb-6 w-full max-w-2xl mx-auto">
                    <div class="chart-container-box">
                        <canvas id="managerWeekChart"></canvas>
                    </div>
                    <div class="grid-buttons-box">
                        <button class="action-dashboard-btn" onclick="alert('إضافة زبون')"><i class="fa-solid fa-user-plus"></i> إضافة زبون جديد</button>
                        <button class="action-dashboard-btn" onclick="switchTab('tasks')"><i class="fa-solid fa-file-invoice-dollar"></i> اصدار فاتورة نقد</button>
                        <button class="action-dashboard-btn" onclick="alert('📦 تم عرض بيانات المخزن من أمس بنجاح')"><i class="fa-solid fa-boxes-stacked"></i> المخزن من أمس</button>
                        <button class="action-dashboard-btn" onclick="alert('تفاصيل البيع')"><i class="fa-solid fa-chart-line"></i> تفاصيل البيع</button>
                        <button class="action-dashboard-btn" onclick="alert('تفاصيل الزبائن')"><i class="fa-solid fa-users"></i> تفاصيل الزبائن</button>
                        <button class="action-dashboard-btn full-width-btn" onclick="alert('جرد المخازن')"><i class="fa-solid fa-clipboard-list"></i> جرد المخازن</button>
                    </div>
                </div>
            `;
        }

        function initManagerChart() {
            const ctxElem = document.getElementById('managerWeekChart');
            if(!ctxElem) return;
            const ctx = ctxElem.getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'],
                    datasets: [{
                        label: 'حركة مبيعات الدواجن',
                        data: [120, 190, 150, 220, 180, 250],
                        borderColor: '#facc15',
                        backgroundColor: 'rgba(250, 204, 21, 0.15)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.35
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- واجهة مسوق مزارع مع زري "ترحيل" و "الحساب" فقط ---
        async function fetchMarketShipmentData() {
            const container = document.getElementById('tabContentContainer');
            try {
                const response = await fetch('/api/market-shipment');
                const result = await response.json();
                if (result.success) {
                    container.innerHTML = getMarketShipmentUI(result.data);
                }
            } catch (err) {
                container.innerHTML = `<div class="text-red-400">خطأ في جلب بيانات التقرير من قاعدة البيانات.</div>`;
            }
        }

        function getMarketShipmentUI(data) {
            const rows = data.rows || {};
            const getVal = (type, field) => (rows[type] && rows[type][field] !== undefined) ? rows[type][field] : 0;

            const chickenTypes = [
                { key: 'كبير', label: 'كبير' },
                { key: 'مخورج', label: 'مخورج' },
                { key: 'متوسط', label: 'متوسط' },
                { key: 'مطاعم', label: 'مطاعم' },
                { key: 'صغير', label: 'صغير' },
                { key: 'جفش', label: 'جفش' }
            ];

            let rowsHtml = chickenTypes.map(item => {
                let boxes = getVal(item.key, 'boxes');
                let packing = getVal(item.key, 'packing');
                let price = getVal(item.key, 'price');
                let total = boxes * packing;

                return `
                    <tr class="chicken-row" data-type="${item.key}">
                        <td class="py-3 px-2 text-right font-medium truncate">${item.label}</td>
                        <td class="py-3 px-2">
                            <input type="number" value="${boxes}" class="boxes w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" oninput="calculateTotal(this)" onblur="updateRowField(this, 'boxes')">
                        </td>
                        <td class="py-3 px-2">
                            <input type="number" value="${packing}" class="packing w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" oninput="calculateTotal(this)" onblur="updateRowField(this, 'packing')">
                        </td>
                        <td class="py-3 px-2 text-[#facc15] font-bold total-chickens">${total}</td>
                        <td class="py-3 px-2 text-left">
                            <input type="number" value="${price}" class="price w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" onblur="updateRowField(this, 'price')">
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="w-full max-w-5xl bg-[#111827] border border-[#1f293d] rounded-2xl p-6 shadow-2xl flex flex-col justify-between my-auto h-[88vh]">
                    <div>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5 bg-[#0f172a] p-4 rounded-xl border border-[#1e293b]">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">المزرعة:</label>
                                <input type="text" id="farmName" value="${data.farmName || ''}" onblur="updateField('farmName', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">بيانات الشحنة:</label>
                                <input type="text" id="shipmentDetails" value="${data.shipmentDetails || ''}" onblur="updateField('shipmentDetails', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">المسوق المسؤول:</label>
                                <input type="text" id="marketerName" value="${data.marketerName || ''}" onblur="updateField('marketerName', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">تاريخ الوارد:</label>
                                <input type="text" id="shipmentDate" value="${data.shipmentDate || ''}" onblur="updateField('shipmentDate', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-center border-collapse table-fixed">
                                <thead>
                                    <tr class="text-[#facc15] text-sm border-b border-[#1f293d]">
                                        <th class="py-3 px-2 text-right">نوع الدجاج</th>
                                        <th class="py-3 px-2">عدد الصناديق</th>
                                        <th class="py-3 px-2">تعبئة الصندوق</th>
                                        <th class="py-3 px-2">إجمالي الدجاج</th>
                                        <th class="py-3 px-2 text-left">سعر البيع</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#1f293d]/50 text-sm text-gray-200" id="chickenTable">
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- زري الترحيل والحساب فقط في قسم مسؤول مزارع -->
                    <div class="mt-4 pt-2 grid grid-cols-2 gap-3">
                        <button onclick="executeTransfer()" class="bg-[#facc15] hover:bg-[#eab308] text-gray-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg text-sm cursor-pointer flex items-center justify-center gap-2">
                            <i class="fa-solid fa-share-nodes"></i> ترحيل (تخفيض الكميات في المخزن)
                        </button>
                        <button onclick="switchTab('account')" class="bg-[#1f293d] hover:bg-[#334155] text-[#facc15] border border-[#facc15]/40 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg text-sm cursor-pointer flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-gear"></i> الحساب
                        </button>
                    </div>
                </div>
            `;
        }

        function calculateTotal(element) {
            const row = element.closest('.chicken-row');
            const boxes = parseFloat(row.querySelector('.boxes').value) || 0;
            const packing = parseFloat(row.querySelector('.packing').value) || 0;
            const totalCell = row.querySelector('.total-chickens');
            totalCell.textContent = boxes * packing;
        }

        async function updateField(fieldName, fieldValue) {
            try {
                await fetch('/api/update-field', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fieldName, fieldValue })
                });
            } catch (err) {
                console.error('خطأ:', err);
            }
        }

        async function updateRowField(element, subField) {
            const row = element.closest('.chicken-row');
            const chickenType = row.getAttribute('data-type');
            const fieldValue = element.value;

            try {
                await fetch('/api/update-row-field', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chickenType, subField, fieldValue })
                });
            } catch (err) {
                console.error('خطأ:', err);
            }
        }

        // دالة تنفيذ الترحيل وتخفيض الكميات في قاعدة البيانات
        async function executeTransfer() {
            if(!confirm('هل أنت متأكد من رغبتك في ترحيل الشحنة وتخفيض الكميات الحالية في المخزن؟')) return;
            try {
                const response = await fetch('/api/market-shipment/transfer', { method: 'POST' });
                const result = await response.json();
                if(result.success) {
                    alert('✅ ' + result.message);
                } else {
                    alert('❌ حدث خطأ أثناء الترحيل.');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالخادم.');
            }
        }
    </script>
</body>
</html>
