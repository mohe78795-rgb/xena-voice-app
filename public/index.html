<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصل الشبوك - معجم لتسويق الدواجن</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* خلفية ضوئية رقمية متناسقة مع الهوية */
    .digital-glow {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
    }
    /* إخفاء شريط التمرير لإعطاء مظهر تطبيق هاتف native */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 font-sans min-h-screen text-slate-100 flex flex-col justify-between pb-20 select-none">

  <!-- ==================== 1. الهيدر العلوي الاحترافي ==================== -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      
      <!-- شعار وعنوان المكتب -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-inner">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-wide flex items-center gap-1.5">
            معجم لتسويق الدواجن
          </h1>
          <p class="text-[11px] text-emerald-400 font-medium">نظام محصل الشبوك الفارغة</p>
        </div>
      </div>

      <!-- مؤشر الاتصال والعمليات السريعة -->
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          مباشر
        </span>
      </div>

    </div>
  </header>

  <!-- ==================== 2. محتوى الصفحة الرئيسية (عرض الزبائن) ==================== -->
  <main class="max-w-md mx-auto w-full px-4 py-4 space-y-4 flex-1">

    <!-- شريط البحث السريع عن زبون -->
    <div class="relative">
      <input type="text" id="searchInput" oninput="filterCustomers()" placeholder="ابحث باسم الزبون أو رقم الهاتف..." 
             class="w-full bg-slate-900 border border-slate-800 pl-4 pr-10 py-3 rounded-2xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition shadow-inner">
      <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-slate-500 text-sm"></i>
    </div>

    <!-- قائمة كروت الزبائن -->
    <div id="customersContainer" class="space-y-4">
      <!-- يتم توليد كروت الزبائن آلياً عبر الجافاسكريبت هنا -->
    </div>

  </main>

  <!-- ==================== 3. الأزرار السفلية الثلاثة (الشريط الرئيسي) ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 py-2 px-6 shadow-2xl">
    <div class="max-w-md mx-auto flex justify-between items-center">

      <!-- 1. الرئيسية -->
      <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center gap-1 text-emerald-400 font-semibold transition group">
        <div class="w-10 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition">
          <i class="fa-solid fa-house text-sm"></i>
        </div>
        <span class="text-[11px]">الرئيسية</span>
      </button>

      <!-- 2. الرسائل -->
      <button onclick="switchTab('messages')" id="tab-messages" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition group">
        <div class="relative w-10 h-8 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center group-hover:scale-110 transition">
          <i class="fa-solid fa-comments text-sm"></i>
          <!-- تنبيه عدد الرسائل -->
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-indigo-600 text-white text-[9px] font-bold rounded-full flex items-center justify-center border border-slate-900">3</span>
        </div>
        <span class="text-[11px]">الرسائل</span>
      </button>

      <!-- 3. التنبيهات -->
      <button onclick="switchTab('notifications')" id="tab-notifications" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition group">
        <div class="relative w-10 h-8 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center group-hover:scale-110 transition">
          <i class="fa-solid fa-bell text-sm"></i>
          <!-- تنبيه أحمر -->
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-rose-500 rounded-full border border-slate-900 animate-pulse"></span>
        </div>
        <span class="text-[11px]">التنبيهات</span>
      </button>

    </div>
  </nav>

  <!-- ==================== السكريبت البرمجي للواجهة ==================== -->
  <script>
    // بيانات الزبائن الميدانية النموذجية
    let customers = [
      {
        id: 1,
        name: "محل البركة للدواجن",
        phone: "771234567",
        maps_url: "https://maps.google.com/?q=13.9800,45.5700",
        previous_crates: 45, // شبوك فارغة سابقة
        today_crates: 15,    // شبوك استلمها اليوم
      },
      {
        id: 2,
        name: "شواية الخير والمطاعم",
        phone: "777888999",
        maps_url: "https://maps.google.com/?q=13.9850,45.5750",
        previous_crates: 30,
        today_crates: 20,
      },
      {
        id: 3,
        name: "مركز السلام للدواجن الحية",
        phone: "733445566",
        maps_url: "https://maps.google.com/?q=13.9700,45.5600",
        previous_crates: 80,
        today_crates: 0,
      }
    ];

    // عرض قائمة الزبائن في الواجهة
    function renderCustomers(list = customers) {
      const container = document.getElementById('customersContainer');
      
      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500">
            <i class="fa-solid fa-box-open text-3xl mb-2"></i>
            <p class="text-xs">لا يوجد زبائن مطايقين للبحث</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(c => {
        const totalCrates = c.previous_crates + c.today_crates;
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl space-y-4 relative overflow-hidden">
            
            <!-- هيدر بطاقة الزبون (اسم ورقم وهاتف) -->
            <div class="flex items-start justify-between pb-3 border-b border-slate-800">
              <div class="space-y-1">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                  <i class="fa-solid fa-store text-emerald-400 text-xs"></i> ${c.name}
                </h2>
                <div class="flex items-center gap-3 text-xs text-slate-400 font-mono">
                  <span><i class="fa-solid fa-phone text-[10px] text-slate-500 ml-1"></i>${c.phone}</span>
                </div>
              </div>

              <!-- أزرار الاتصال السريع والموقع -->
              <div class="flex items-center gap-1.5">
                <a href="tel:${c.phone}" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-emerald-600/20 hover:text-emerald-400 border border-slate-700 flex items-center justify-center text-slate-300 text-xs transition">
                  <i class="fa-solid fa-phone"></i>
                </a>
                <a href="${c.maps_url}" target="_blank" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-indigo-600/20 hover:text-indigo-400 border border-slate-700 flex items-center justify-center text-indigo-400 text-xs transition" title="فتح الموقع في الخريطة">
                  <i class="fa-solid fa-location-dot"></i>
                </a>
              </div>
            </div>

            <!-- شبكة تفاصيل الشبوك (سابق - اليوم - إجمالي) -->
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                <span class="block text-[10px] text-slate-400 mb-0.5">شبوك سابقة</span>
                <span class="text-sm font-bold text-slate-200 font-mono">${c.previous_crates}</span>
              </div>
              <div class="bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80">
                <span class="block text-[10px] text-slate-400 mb-0.5">شبوك اليوم</span>
                <span class="text-sm font-bold text-indigo-400 font-mono">+${c.today_crates}</span>
              </div>
              <div class="digital-glow p-2.5 rounded-2xl border border-emerald-500/40">
                <span class="block text-[10px] text-emerald-300 mb-0.5 font-semibold">الإجمالي المتبقي</span>
                <span class="text-base font-black text-emerald-400 font-mono tracking-wider">${totalCrates}</span>
              </div>
            </div>

            <!-- حقل استلام الشبوك الفارغة (حقل واحد فقط للعمل السريع) -->
            <form onsubmit="handleReceiveCrates(event, ${c.id})" class="pt-1 flex gap-2">
              <div class="relative flex-1">
                <input type="number" id="input_crates_${c.id}" min="1" max="${totalCrates}" placeholder="عدد الشبوك المستلمة..." required
                       class="w-full bg-slate-950 border border-slate-800 p-2.5 pr-8 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500 font-mono">
                <i class="fa-solid fa-box-archive absolute right-3 top-3 text-slate-500 text-xs"></i>
              </div>

              <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 rounded-xl text-xs transition shadow-lg shadow-emerald-900/30 flex items-center gap-1.5 shrink-0">
                <i class="fa-solid fa-check"></i> استلام
              </button>
            </form>

          </div>
        `;
      }).join('');
    }

    // خصم واستلام الصناديق من الزبون
    function handleReceiveCrates(event, customerId) {
      event.preventDefault();
      const inputEl = document.getElementById(`input_crates_${customerId}`);
      const amount = Number(inputEl.value);

      const customer = customers.find(c => c.id === customerId);
      if (!customer) return;

      const currentTotal = customer.previous_crates + customer.today_crates;

      if (amount > currentTotal) {
        alert('العدد المدخل أكبر من إجمالي الشبوك المتبقية على الزبون!');
        return;
      }

      // خصم الكمية من الحساب
      if (customer.today_crates >= amount) {
        customer.today_crates -= amount;
      } else {
        const remainingToDeduct = amount - customer.today_crates;
        customer.today_crates = 0;
        customer.previous_crates -= remainingToDeduct;
      }

      alert(`تم استلام ${amount} صندوق فارغ من (${customer.name}) بنجاح!`);
      inputEl.value = '';
      renderCustomers();
    }

    // تصفية الزبائن بالبحث
    function filterCustomers() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = customers.filter(c => 
        c.name.toLowerCase().includes(query) || c.phone.includes(query)
      );
      renderCustomers(filtered);
    }

    // التنقل بين أزرار التبويب السفلية
    function switchTab(tabName) {
      const tabs = ['home', 'messages', 'notifications'];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (t === tabName) {
          el.className = "flex flex-col items-center gap-1 text-emerald-400 font-semibold transition group";
          el.querySelector('div').className = "w-10 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 group-hover:scale-110 transition";
        } else {
          el.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-400 transition group";
          el.querySelector('div').className = "relative w-10 h-8 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center group-hover:scale-110 transition";
        }
      });

      if (tabName !== 'home') {
        alert(`قسم ${tabName === 'messages' ? 'الرسائل' : 'التنبيهات'} قيد التطوير والتحديث.`);
      }
    }

    // التشغيل المبدئي عند تحميل الواجهة
    window.onload = () => {
      renderCustomers();
    };
  </script>
</body>
</html>
