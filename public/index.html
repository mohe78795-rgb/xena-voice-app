<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة زبناء الصناديق - ZOE</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen text-gray-800">

  <div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-center text-indigo-700">نظام إدارة الزبناء والصناديق (ZOE)</h1>

    <!-- نموذج إضافة زبون جديد -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">إضافة زبون جديد</h2>
      <form id="addCustomerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1">اسم الزبون</label>
          <input type="text" id="name" required class="w-full border p-2 rounded-lg border-gray-300">
        </div>
        <div>
          <label class="block text-sm mb-1">رقم الهاتف</label>
          <input type="text" id="phone" required class="w-full border p-2 rounded-lg border-gray-300">
        </div>
        <div>
          <label class="block text-sm mb-1">رابط الموقع (Google Maps)</label>
          <input type="url" id="google_maps_url" class="w-full border p-2 rounded-lg border-gray-300">
        </div>
        <div>
          <label class="block text-sm mb-1">الصناديق المسلمة (فارغة لدى الزبون)</label>
          <input type="number" id="total_delivered" value="0" min="0" class="w-full border p-2 rounded-lg border-gray-300">
        </div>
        <div>
          <label class="block text-sm mb-1">الصناديق المحصلة منه</label>
          <input type="number" id="total_returned" value="0" min="0" class="w-full border p-2 rounded-lg border-gray-300">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">حفظ البيانات</button>
        </div>
      </form>
    </div>

    <!-- قائمة عرض واستدعاء الزبناء -->
    <div class="bg-white p-6 rounded-xl shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-700">قائمة الزبناء</h2>
        <button onclick="fetchCustomers()" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg text-sm hover:bg-gray-300">تحديث البيانات</button>
      </div>
      <div id="customersList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- سيتم استدعاء وعرض البطاقات هنا تلقائياً -->
      </div>
    </div>
  </div>

  <script>
    // 1. استدعاء البيانات عند تحميل الصفحة
    async function fetchCustomers() {
      const list = document.getElementById('customersList');
      list.innerHTML = '<p class="text-gray-500">جاري تحميل البيانات...</p>';
      
      try {
        const res = await fetch('/api/zoe');
        const data = await res.json();

        if (data.success && data.data.length > 0) {
          list.innerHTML = data.data.map(item => `
            <div class="border rounded-lg p-4 bg-gray-50 space-y-2 shadow-sm">
              <div class="flex justify-between items-center border-b pb-2">
                <span class="font-bold text-indigo-900">${item.name}</span>
                <span class="text-sm bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">${item.phone}</span>
              </div>
              <div class="text-sm text-gray-600">
                <p>صناديق لديه: <strong>${item.crates_balance?.total_delivered || 0}</strong></p>
                <p>صناديق محصلة: <strong>${item.crates_balance?.total_returned || 0}</strong></p>
                <p class="text-red-600 font-bold">باقي لديه (المتبقي): ${item.crates_balance?.remaining_debt || 0}</p>
              </div>
              ${item.location?.google_maps_url ? `
                <a href="${item.location.google_maps_url}" target="_blank" class="inline-block text-xs text-blue-600 hover:underline">عرض الموقع على الخريطة 📍</a>
              ` : ''}
            </div>
          `).join('');
        } else {
          list.innerHTML = '<p class="text-gray-500">لا يوجد زبناء مسجلين حالياً.</p>';
        }
      } catch (err) {
        list.innerHTML = '<p class="text-red-500">حدث خطأ أثناء جلب البيانات.</p>';
      }
    }

    // 2. إرسال وإضافة البيانات
    document.getElementById('addCustomerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        google_maps_url: document.getElementById('google_maps_url').value,
        total_delivered: document.getElementById('total_delivered').value,
        total_returned: document.getElementById('total_returned').value,
      };

      try {
        const res = await fetch('/api/zoe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert('تم إضافة الزبون بنجاح!');
          document.getElementById('addCustomerForm').reset();
          fetchCustomers(); // إعادة استدعاء التحديث لتظهر الإضافة مباشرة
        } else {
          alert('خطأ: ' + result.message);
        }
      } catch (err) {
        alert('حدث خطأ أثناء الإضافة!');
      }
    });

    // استدعاء البيانات تلقائياً أول مرة
    fetchCustomers();
  </script>
</body>
</html>
