<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصل الشبوك - معجم لتسويق الدواجن</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #f8fafc; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="font-sans min-h-screen text-slate-800 flex flex-col justify-between pb-24 select-none">

  <!-- ==================== 1. الهيدر العلوي ==================== -->
  <header class="sticky top-0 z-40 bg-slate-900 text-white border-b-2 border-emerald-500 px-4 py-3.5 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black text-xl shadow">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <div>
          <h1 class="text-base font-black text-white tracking-wide leading-tight">
            معجم لتسويق الدواجن
          </h1>
          <p class="text-[11px] text-emerald-400 font-bold">نظام محصل الشبوك الفارغة</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="serverStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-emerald-400 border border-emerald-500/30 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          مربوط
        </span>
      </div>

    </div>
  </header>

  <!-- ==================== 2. محتوى الصفحة الرئيسية ==================== -->
  <main class="max-w-md mx-auto w-full px-4 py-4 space-y-4 flex-1">

    <!-- شريط البحث السريع -->
    <div class="relative">
      <input type="text" id="searchInput" oninput="filterCustomers()" placeholder="ابحث باسم الزبون أو رقم الهاتف..." 
             class="w-full bg-white border border-slate-300 pl-4 pr-11 py-3 rounded-2xl text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-none focus:border-slate-800 focus:ring-2 focus:ring-slate-200 shadow-sm">
      <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-slate-400 text-sm"></i>
    </div>

    <!-- قائمة الزبائن -->
    <div id="customersContainer" class="space-y-4">
      <div class="text-center py-12 text-slate-600 font-bold">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-slate-800"></i>
        <p class="text-xs">جاري الاتصال بقاعدة البيانات...</p>
      </div>
    </div>

  </main>

  <!-- ==================== 3. الشريط السفلي ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 text-white border-t border-slate-800 py-2.5 px-6 shadow-2xl">
    <div class="max-w-md mx-auto flex justify-between items-center">

      <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center gap-1 transition group">
        <div class="w-11 h-8 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black group-hover:scale-105 transition shadow">
          <i class="fa-solid fa-house text-sm"></i>
        </div>
        <span class="text-xs text-emerald-400 font-bold">الرئيسية</span>
      </button>

      <button onclick="switchTab('messages')" id="tab-messages" class="flex flex-col items-center gap-1 transition group">
        <div class="relative w-11 h-8 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center group-hover:scale-105 transition">
          <i class="fa-solid fa-comments text-sm"></i>
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 text-slate-950 text-[10px] font-black rounded-full flex items-center justify-center border border-slate-900">3</span>
        </div>
        <span class="text-xs text-slate-300 font-medium">الرسائل</span>
      </button>

      <button onclick="switchTab('notifications')" id="tab-notifications" class="flex flex-col items-center gap-1 transition group">
        <div class="relative w-11 h-8 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center group-hover:scale-105 transition">
          <i class="fa-solid fa-bell text-sm"></i>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full border border-slate-900 animate-pulse"></span>
        </div>
        <span class="text-xs text-slate-300 font-medium">التنبيهات</span>
      </button>

    </div>
  </nav>

  <!-- ==================== 4. النافذة المنبثقة التفاعلية (Modal) ==================== -->
  <div id="statusModal" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center px-4 transition-all">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 text-center space-y-4 animate-in fade-in zoom-in duration-200">
      
      <!-- أيقونة الحالة -->
      <div id="modalIconContainer" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl shadow-inner bg-emerald-100 text-emerald-600">
        <i id="modalIcon" class="fa-solid fa-circle-check"></i>
      </div>

      <!-- العنوان والرسالة -->
      <div class="space-y-1">
        <h3 id="modalTitle" class="text-lg font-black text-slate-900">تمت العملية بنجاح!</h3>
        <p id="modalMessage" class="text-xs text-slate-600 font-medium leading-relaxed"></p>
      </div>

      <!-- ملخص تفاصيل الخصم والرصيد الدقيق -->
      <div id="modalDetails" class="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs space-y-1.5 text-right font-medium text-slate-700">
      </div>

      <!-- أزرار التحكم بالنافذة المنبثقة -->
      <div class="flex gap-2 pt-2">
        <!-- زر فتح الواتساب بالرسالة المجهزة -->
        <a id="modalWaBtn" href="#" target="_blank" onclick="closeModal()" 
           class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-sm"></i> إرسال واتساب
        </a>
        
        <!-- زر إغلاق عادي -->
        <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-3 rounded-xl text-xs transition">
          إغلاق
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== البرمجة والربط بالسيرفر ==================== -->
  <script>
    const API_URL = '/api/zoe';
    let allCustomers = [];

    // 1. جلب البيانات من السيرفر
    async function fetchCustomersFromDB() {
      const container = document.getElementById('customersContainer');
      try {
        const res = await fetch(API_URL);
        const result = await res.json();

        if (result.success) {
          allCustomers = result.data || [];
          renderCustomers(allCustomers);
        } else {
          container.innerHTML = `
            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center text-rose-700 font-bold">
              <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-rose-600"></i>
              <p class="text-xs">خطأ في استجابة السيرفر: ${result.message}</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center text-amber-800 font-bold">
            <i class="fa-solid fa-wifi text-3xl mb-2 text-amber-600"></i>
            <p class="text-xs">فشل الاتصال بالسيرفر. تأكد من تشغيل الخادم.</p>
          </div>
        `;
      }
    }

    // 2. تجميع رابط رسالة الواتساب بالصيغة المطلوبة
    function generateWhatsAppLink(rawPhone, name, returned, remaining) {
      let cleanPhone = rawPhone.replace(/\D/g, '');
      if (cleanPhone.startsWith('0')) cleanPhone = cleanPhone.substring(1);
      if (!cleanPhone.startsWith('967')) cleanPhone = '967' + cleanPhone;

      const text = `عميلنا العزيز (${name})
معجم لتسويق الدواجن
محصل الشبوك الفاضية

تم استلام لكم: (${returned}) شبوك فاضية.
المتبقي عليكم: (${remaining}) شبوك.

الرجاء توضيح وابلاغنا عن موقع باقي شبوكنا، مالم سيتم إدراجهم على حسابكم الخاص وتتحملون كافة المسؤولية عند إتلاف الصناديق أو ضياعها.`;

      return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
    }

    // 3. عرض كروت الزبائن مع حساب دقيق للشبوك
    function renderCustomers(list) {
      const container = document.getElementById('customersContainer');
      
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-600 font-bold">
            <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-400"></i>
            <p class="text-xs">لا يوجد زبائن مسجلين في قاعدة البيانات</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(c => {
        // حساب الرصيد الدقيق
        const previousCrates = Number(c.crates_balance?.previous_debt || 0);
        const todayDelivered = Number(c.crates_balance?.today_delivered || 0);
        const totalReturned = Number(c.crates_balance?.total_returned || 0);
        
        // إجمالي المتبقي الحقيقي الدقيق
        const calculatedRemaining = (previousCrates + todayDelivered) - totalReturned;
        const totalRemaining = calculatedRemaining > 0 ? calculatedRemaining : 0;
        
        const mapsUrl = c.location?.google_maps_url || `https://maps.google.com/?q=13.9800,45.5700`;

        return `
          <div class="bg-white border border-slate-200/80 rounded-3xl p-4 shadow-sm space-y-3.5 relative hover:shadow-md transition">
            
            <!-- الهيدر والاسم والاتصال -->
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div class="space-y-1">
                <h2 class="text-sm font-black text-slate-900 flex items-center gap-2">
                  <span class="w-7 h-7 rounded-xl bg-slate-100 text-slate-800 flex items-center justify-center shrink-0 border border-slate-200">
                    <i class="fa-solid fa-store text-xs"></i>
                  </span>
                  ${c.name}
                </h2>
                <div class="flex items-center gap-2 text-xs text-slate-500 font-bold font-mono pr-1">
                  <span>${c.phone}</span>
                </div>
              </div>

              <div class="flex items-center gap-1.5">
                <a href="tel:${c.phone}" 
                   class="w-9 h-9 rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center text-xs transition shadow-sm"
                   title="اتصال تلفوني">
                  <i class="fa-solid fa-phone"></i>
                </a>

                <a href="${mapsUrl}" target="_blank" 
                   class="w-9 h-9 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 flex items-center justify-center text-xs transition shadow-sm" 
                   title="فتح الموقع بالخريطة">
                  <i class="fa-solid fa-location-dot"></i>
                </a>
              </div>
            </div>

            <!-- شبكة تفاصيل أعداد الشبوك بالكامل -->
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/60">
                <span class="block text-[10px] font-bold text-slate-500 mb-0.5">شبوك سابقة</span>
                <span class="text-xs font-black text-slate-800 font-mono">${previousCrates}</span>
              </div>

              <div class="bg-amber-50 p-2.5 rounded-2xl border border-amber-200/60">
                <span class="block text-[10px] font-bold text-amber-700 mb-0.5">مستلم اليوم</span>
                <span class="text-xs font-black text-amber-600 font-mono">+${todayDelivered}</span>
              </div>

              <div class="bg-slate-900 text-white p-2.5 rounded-2xl shadow-sm border border-slate-800">
                <span class="block text-[10px] font-bold text-slate-300 mb-0.5">إجمالي المتبقي</span>
                <span class="text-sm font-black font-mono text-emerald-400 tracking-wider">${totalRemaining}</span>
              </div>
            </div>

            <!-- نموذج استلام الشبوك -->
            <form onsubmit="handleReceiveCrates(event, '${c.name}', '${c.phone}', '${mapsUrl}', ${totalRemaining})" class="pt-1 flex gap-2">
              <div class="relative flex-1">
                <input type="number" id="input_crates_${c.phone}" min="1" max="${totalRemaining > 0 ? totalRemaining : 999}" placeholder="عدد الشبوك المستلمة..." required
                       class="w-full bg-slate-50 border border-slate-300 p-2.5 pr-8 rounded-xl text-xs font-bold text-slate-800 focus:outline-none focus:border-slate-800 font-mono placeholder-slate-400">
                <i class="fa-solid fa-box-archive absolute right-3 top-3 text-slate-400 text-xs"></i>
              </div>

              <button type="submit" id="btn_submit_${c.phone}" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 rounded-xl text-xs transition shadow flex items-center gap-1.5 shrink-0">
                <i class="fa-solid fa-check"></i> استلام
              </button>
            </form>

          </div>
        `;
      }).join('');
    }

    // 4. معالجة العملية وعرض النافذة المنبثقة التفاعلية
    async function handleReceiveCrates(event, customerName, customerPhone, mapUrl, currentRemaining) {
      event.preventDefault();

      const inputEl = document.getElementById(`input_crates_${customerPhone}`);
      const btnEl = document.getElementById(`btn_submit_${customerPhone}`);
      const amount = Number(inputEl.value);

      if (!amount || amount <= 0) return;

      btnEl.disabled = true;
      btnEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> حفظ...`;

      const payload = {
        name: customerName,
        phone: customerPhone,
        google_maps_url: mapUrl,
        total_delivered: 0,
        total_returned: amount
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          const newRemaining = Math.max(0, currentRemaining - amount);
          const waUrl = generateWhatsAppLink(customerPhone, customerName, amount, newRemaining);

          // عرض النافذة المنبثقة
          showModal({
            title: 'تم تسجيل الاستلام بنجاح!',
            message: `تم خصم وتسجيل استلام الشبوك بنجاح للزبون (${customerName}).`,
            waUrl: waUrl,
            details: `
              <div class="flex justify-between border-b border-slate-200 pb-1"><span>اسم الزبون:</span> <strong class="text-slate-900">${customerName}</strong></div>
              <div class="flex justify-between border-b border-slate-200 pb-1"><span>الشبوك المستلمة:</span> <strong class="text-emerald-600">${amount} صندوق</strong></div>
              <div class="flex justify-between"><span>المتبقي عليه الآن:</span> <strong class="text-rose-600">${newRemaining} صندوق</strong></div>
            `
          });

          inputEl.value = '';
          fetchCustomersFromDB();
        } else {
          alert('خطأ في العملية: ' + result.message);
        }
      } catch (err) {
        alert('تعذر الاتصال بالسيرفر لحفظ الحركة!');
      } finally {
        btnEl.disabled = false;
        btnEl.innerHTML = `<i class="fa-solid fa-check"></i> استلام`;
      }
    }

    // 5. إظهار وإغلاق النافذة المنبثقة
    function showModal({ title, message, details, waUrl }) {
      const modal = document.getElementById('statusModal');
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerText = message;
      document.getElementById('modalDetails').innerHTML = details;
      
      const waBtn = document.getElementById('modalWaBtn');
      waBtn.href = waUrl;

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('statusModal').classList.add('hidden');
    }

    // 6. فلترة الزبائن
    function filterCustomers() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allCustomers.filter(c => 
        (c.name && c.name.toLowerCase().includes(query)) || 
        (c.phone && c.phone.includes(query))
      );
      renderCustomers(filtered);
    }

    // 7. التنقل بين الصفحات السفلية
    function switchTab(tabName) {
      const tabs = ['home', 'messages', 'notifications'];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const iconDiv = el.querySelector('div');
        const textSpan = el.querySelector('span');

        if (t === tabName) {
          iconDiv.className = "w-11 h-8 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-black group-hover:scale-105 transition shadow";
          textSpan.className = "text-xs text-emerald-400 font-bold";
        } else {
          iconDiv.className = "relative w-11 h-8 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 flex items-center justify-center group-hover:scale-105 transition";
          textSpan.className = "text-xs text-slate-300 font-medium";
        }
      });

      if (tabName !== 'home') {
        alert(`قسم ${tabName === 'messages' ? 'الرسائل' : 'التنبيهات'} قيد التحديث.`);
      }
    }

    window.onload = () => {
      fetchCustomersFromDB();
    };
  </script>
</body>
</html>
