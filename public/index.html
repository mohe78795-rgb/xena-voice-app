<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الخدمات الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .theme-ym { --primary: #991b3b; --primary-hover: #801430; --light: #ffedd5; --badge-bg: #fff1f2; }
        .theme-you { --primary: #f59e0b; --primary-hover: #d97706; --light: #fef3c7; --badge-bg: #fffbeb; }
        .theme-saba { --primary: #0284c7; --primary-hover: #0369a1; --light: #e0f2fe; --badge-bg: #f0f9ff; }
        .theme-why { --primary: #7c3aed; --primary-hover: #6d28d9; --light: #ede9fe; --badge-bg: #f5f3ff; }
        .theme-yem4g { --primary: #0284c7; --primary-hover: #0369a1; --light: #e0f2fe; --badge-bg: #f0f9ff; }
        .accordion-content { transition: max-height 0.3s ease-in-out; }
    </style>
</head>
<body id="appBody" class="theme-ym flex flex-col items-center min-h-screen pb-12 transition-colors duration-300">

    <!-- 1. الشريط العلوي (Header) -->
    <header id="mainHeader" class="w-full max-w-md bg-[#991b3b] text-white px-4 py-3 shadow-md flex justify-between items-center rounded-b-3xl transition-colors duration-300">
        <button onclick="refreshBalance()" class="bg-white/25 hover:bg-white/35 p-2 rounded-full transition active:scale-95">
            <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>

        <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="toggleBalance()">
            <span class="text-xs text-white/90 font-bold">رصيدي</span>
            <span id="balanceDisplay" class="text-base font-black tracking-wider">*****</span>
            <svg class="h-4 w-4 text-white/90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
        </div>

        <div class="bg-white/25 p-2 rounded-full cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065Z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
            </svg>
        </div>
    </header>

    <!-- المحتوى الرئيسي للموبايل -->
    <main class="w-full max-w-md px-3.5 mt-3 space-y-3">

        <!-- 2. صندوق إدخال رقم الهاتف -->
        <div class="bg-white rounded-2xl shadow-sm p-3 border border-slate-200 flex items-center justify-between">
            <div class="flex items-center space-x-2 space-x-reverse text-slate-400">
                <svg id="inputUserIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#991b3b]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <button onclick="clearInput()" class="text-rose-600 font-black text-sm bg-rose-50 rounded-full w-6 h-6 flex items-center justify-center">✕</button>
            </div>

            <div class="flex-1 mx-2">
                <div class="flex justify-between items-center text-[10px] text-slate-400 font-bold px-1">
                    <span id="charCount">9</span>
                    <span>رقم الهاتف</span>
                </div>
                <div id="phoneInputBorder" class="flex items-center justify-end border-b-2 border-[#991b3b] pb-1">
                    <input type="tel" id="mobileNumber" value="739191949" maxlength="9" oninput="handlePhoneChange(this.value)" class="font-extrabold text-slate-800 outline-none text-base bg-transparent text-right w-full tracking-wider">
                    <span class="text-xs text-slate-500 font-bold ml-1">+967</span>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <div id="companyLogoBadge" class="w-11 h-11 rounded-xl bg-slate-50 flex items-center justify-center border border-slate-200 overflow-hidden shadow-inner p-1">
                    <img id="networkImg" src="https://i.postimg.cc/T2zz6Sms/images-(19).png" alt="Logo" class="object-contain w-full h-full rounded-lg">
                </div>
                <i id="heartIcon" class="fa-solid fa-heart text-[#f59e0b] text-base"></i>
            </div>
        </div>

        <!-- 3. شريط التبويبات الرئيسي -->
        <div id="mainTabsBar" class="grid grid-cols-5 gap-1 bg-[#fef3c7] p-1.5 rounded-2xl text-center text-xs font-black shadow-inner">
            <button onclick="changeMainTab('rial', this)" class="sub-tab py-2 rounded-xl text-slate-700 transition">فوترة</button>
            <button onclick="changeMainTab('gomla', this)" class="sub-tab py-2 rounded-xl text-slate-700 transition">جملة</button>
            <button onclick="changeMainTab('packages', this)" id="packagesMainTabBtn" class="sub-tab py-2 rounded-xl shadow transition text-white bg-[#f59e0b]">باقات</button>
            <button onclick="changeMainTab('bill', this)" class="sub-tab py-2 rounded-xl text-slate-700 transition">فوري</button>
            <button onclick="changeMainTab('balance', this)" class="sub-tab py-2 rounded-xl text-slate-700 transition">رصيد</button>
        </div>

        <!-- 4. شريط الفلاتر الفرعية الديناميكي -->
        <div id="subFilterRow" class="hidden"></div>

        <!-- 5. قسم الباقات الديناميكي المحمل من السيرفر -->
        <div id="packagesSection" class="space-y-3">
            <div id="dynamicCompanyView" class="space-y-3">
                <div class="bg-white p-6 rounded-2xl text-center border border-slate-200 shadow-sm">
                    <div class="w-8 h-8 border-4 border-[#f59e0b] border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                    <p class="text-xs font-bold text-slate-500">جاري قراءة وتصنيف الباقات من قاعدة البيانات...</p>
                </div>
            </div>
        </div>

        <!-- 6. قسم تسديد الرصيد المباشر (يعرض الفئات المتاحة) -->
        <div id="balanceSection" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
                <label class="block text-xs font-bold text-slate-800">* اختر أو أدخل فئة الرصيد المطلوب</label>
                
                <!-- فئات الرصيد السريعة -->
                <div id="quickRechargeChips" class="grid grid-cols-3 gap-2">
                    <button onclick="selectRechargeAmount(500)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">500 ريال</button>
                    <button onclick="selectRechargeAmount(1000)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">1000 ريال</button>
                    <button onclick="selectRechargeAmount(2000)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">2000 ريال</button>
                    <button onclick="selectRechargeAmount(3000)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">3000 ريال</button>
                    <button onclick="selectRechargeAmount(5000)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">5000 ريال</button>
                    <button onclick="selectRechargeAmount(10000)" class="bg-slate-50 border border-slate-200 hover:border-amber-500 py-2 rounded-xl text-xs font-black text-slate-700 transition">10000 ريال</button>
                </div>

                <div class="flex items-center bg-white border border-slate-300 rounded-xl px-3 py-2.5 mt-2">
                    <input type="number" id="directBalanceInput" oninput="updateBalanceNet(this.value)" placeholder="أدخل المبلغ يدوياً" class="w-full text-right font-extrabold text-slate-700 outline-none text-base">
                    <span class="text-slate-400 mr-2 font-bold">💲</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
                <label class="block text-xs font-bold text-slate-600">صافي الرصيد بعد خصم الضريبة</label>
                <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5">
                    <input type="text" id="directBalanceNet" readonly placeholder="0.00" class="w-full text-right font-extrabold text-slate-700 outline-none text-base bg-transparent">
                    <span class="text-slate-400 mr-2 font-bold">💲</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="queryPhoneNumber()" class="bg-[#fed7aa] hover:bg-[#fdba74] text-slate-900 font-extrabold py-3.5 rounded-2xl text-sm shadow">استعلام</button>
                <button id="payBalanceBtn" onclick="payDirectBalance()" class="bg-[#f59e0b] text-white font-extrabold py-3.5 rounded-2xl text-sm shadow">تسديد الرصيد</button>
            </div>
        </div>

        <!-- 7. قسم الشحن الفوري السريع -->
        <div id="billSection" class="space-y-3 hidden">
            <div id="quickCardsContainer" class="grid grid-cols-3 gap-2"></div>
        </div>

        <!-- 8. قسم شحن الجملة والفوترة -->
        <div id="gomlaSection" class="space-y-3 hidden">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2">
                <label id="quantityLabel" class="block text-xs font-bold text-slate-800">* ادخل الكمية</label>
                <div class="flex items-center bg-white border border-slate-300 rounded-xl px-3 py-2.5">
                    <input type="number" id="gomlaQty" placeholder="الكمية" class="w-full text-right font-extrabold text-slate-700 outline-none text-base">
                    <span class="text-slate-400 mr-2 font-bold">💲</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="queryPhoneNumber()" class="bg-[#fed7aa] hover:bg-[#fdba74] text-slate-900 font-extrabold py-3.5 rounded-2xl text-sm shadow">استعلام</button>
                <button id="submitGomlaBtn" onclick="submitGomla()" class="bg-[#f59e0b] text-white font-extrabold py-3.5 rounded-2xl text-sm shadow">تسديد</button>
            </div>
        </div>

    </main>

    <!-- نافذة التحكم بالباقة السفلية (Bottom Sheet) -->
    <div id="packageBottomSheet" class="fixed inset-0 bg-black/60 z-40 hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-5 space-y-4 shadow-2xl border-t border-slate-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 id="sheetPackageTitle" class="text-base font-black text-slate-800">اسم الباقة</h3>
                <button onclick="closeBottomSheet()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
            </div>

            <div id="solfaOptionBox" class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                <span class="text-xs font-bold text-blue-600">تسديد مبلغ السلفة مع التفعيل</span>
                <input type="checkbox" id="sheetSolfaCheck" class="w-5 h-5 rounded">
            </div>

            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-700">سعر الباقة:</span>
                <div class="flex items-center gap-1 border border-slate-300 rounded-lg px-3 py-1 bg-white">
                    <span id="sheetPackagePrice" class="font-black text-sm text-slate-800">0</span>
                    <span class="text-xs text-slate-500 font-bold">ريال</span>
                </div>
            </div>

            <div class="text-[11px] text-slate-500 space-y-1 font-bold">
                <div class="flex justify-between"><span>الصافي بعد خصم الضريبة:</span><span id="sheetNetPrice" class="text-slate-700">0.00</span></div>
            </div>

            <div class="space-y-2 pt-2">
                <button onclick="triggerOrderFromSheet('تفعيل من الرصيد')" class="w-full bg-slate-100 hover:bg-slate-200 text-blue-800 font-black py-3 rounded-2xl text-xs flex items-center justify-center gap-2 border border-slate-200 transition">
                    <i class="fa-solid fa-money-bill-wave"></i> تفعيل من الرصيد
                </button>
                <button id="sheetConfirmBtn" onclick="triggerOrderFromSheet('تسديد + تفعيل')" class="w-full bg-[#f59e0b] text-white font-black py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 shadow transition">
                    <i class="fa-solid fa-circle-check"></i> تسديد + تفعيل
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد الطلب والآلة الحاسبة -->
    <div id="orderConfirmationModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-3.5 shadow-2xl border border-slate-200 text-center relative">
            <button onclick="closeConfirmModal()" class="absolute top-3 left-3 w-7 h-7 rounded-full bg-rose-100 text-rose-600 font-bold flex items-center justify-center text-xs">✕</button>

            <div class="w-14 h-14 rounded-full bg-amber-100 text-amber-500 flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 class="text-sm font-black text-amber-600">تأكيد الطلب</h3>

            <div class="text-[11px] font-bold text-blue-600 text-right">تفاصيل الطلب</div>
            <div class="grid grid-cols-3 bg-slate-50 border border-slate-200 rounded-xl overflow-hidden text-[10px] text-center divide-x divide-x-reverse divide-slate-200 font-bold">
                <div class="p-1.5"><span class="text-slate-400 block mb-0.5">الخدمة</span><span id="confirmCompany" class="text-slate-800">--</span></div>
                <div class="p-1.5"><span class="text-slate-400 block mb-0.5">الصنف</span><span id="confirmCategory" class="text-slate-800">--</span></div>
                <div class="p-1.5"><span class="text-slate-400 block mb-0.5">رقم الهاتف</span><span id="confirmPhone" class="text-slate-800">--</span></div>
            </div>

            <p id="costInWords" class="text-xs font-black text-slate-800 bg-amber-50 py-1 rounded-lg border border-amber-200">* اجمالي التكلفة : --</p>

            <div class="bg-slate-50 border border-slate-200 rounded-xl p-2 space-y-2">
                <input type="text" id="receivedAmountInput" placeholder="المبلغ المستلم" class="w-full bg-white border border-slate-300 rounded-lg p-1.5 text-center text-xs font-bold outline-none">
                <div class="grid grid-cols-6 gap-1 text-[11px] font-black">
                    <button onclick="pressKey('1')" class="bg-white p-1 rounded border shadow-sm">1</button>
                    <button onclick="pressKey('2')" class="bg-white p-1 rounded border shadow-sm">2</button>
                    <button onclick="pressKey('3')" class="bg-white p-1 rounded border shadow-sm">3</button>
                    <button onclick="pressKey('4')" class="bg-white p-1 rounded border shadow-sm">4</button>
                    <button onclick="pressKey('5')" class="bg-white p-1 rounded border shadow-sm">5</button>
                    <button onclick="pressKey('6')" class="bg-white p-1 rounded border shadow-sm">6</button>
                    <button onclick="pressKey('7')" class="bg-white p-1 rounded border shadow-sm">7</button>
                    <button onclick="pressKey('8')" class="bg-white p-1 rounded border shadow-sm">8</button>
                    <button onclick="pressKey('9')" class="bg-white p-1 rounded border shadow-sm">9</button>
                    <button onclick="pressKey('0')" class="bg-white p-1 rounded border shadow-sm">0</button>
                    <button onclick="pressKey('clear')" class="bg-rose-50 text-rose-600 p-1 rounded border col-span-2 shadow-sm">x</button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-1.5 pt-1">
                <button onclick="sendFinalOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1 shadow">
                    <i class="fa-solid fa-check"></i> موافق
                </button>
                <button onclick="shareViaSMS()" class="bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1 shadow">
                    <i class="fa-solid fa-envelope"></i> عبر الرسائل
                </button>
                <button onclick="shareViaWhatsapp()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1 shadow">
                    <i class="fa-brands fa-whatsapp"></i> واتساب
                </button>
            </div>
        </div>
    </div>

    <script>
        let ALL_PACKAGES = [];
        let selectedPackage = null;
        let isBalanceOpen = false;
        let currentCompanyCode = "you"; 
        let currentSubFilter = 'all';

        window.onload = async function() {
            await fetchPackagesFromServer();
            handlePhoneChange(document.getElementById('mobileNumber').value);
        };

        async function fetchPackagesFromServer() {
            try {
                const res = await fetch('/api/products');
                const json = await res.json();
                if (json.success && Array.isArray(json.data)) {
                    ALL_PACKAGES = json.data;
                    renderCompanyLayout();
                }
            } catch (err) {
                console.error("خطأ في جلب الباقات:", err);
            }
        }

        function handlePhoneChange(val) {
            document.getElementById('charCount').innerText = val.length;
            const prefix = val.substring(0, 2);
            
            if (prefix === '73') {
                setCompanyTheme('you', 'https://i.postimg.cc/T2zz6Sms/images-(19).png', '#f59e0b', '#fef3c7');
            } else if (prefix === '71') {
                setCompanyTheme('saba', 'https://i.postimg.cc/44DDgMtS/tnzyl-(2).jpg', '#0284c7', '#e0f2fe');
            } else if (prefix === '70') {
                setCompanyTheme('why', 'https://i.postimg.cc/9fgkNNCF/ev4KBYC3-400x400.png', '#7c3aed', '#ede9fe');
            } else if (prefix === '10') {
                setCompanyTheme('yem4g', 'https://i.postimg.cc/BZrr0yD7/images-2026-07-06T163911-011.jpg', '#0284c7', '#e0f2fe');
            } else {
                setCompanyTheme('ym', 'https://i.postimg.cc/BZrr0yD7/images-2026-07-06T163911-011.jpg', '#991b3b', '#ffedd5');
            }

            renderCompanyLayout();
            renderQuickCards();
        }

        function setCompanyTheme(code, logoUrl, primaryColor, lightColor) {
            currentCompanyCode = code;
            currentSubFilter = 'all';
            document.getElementById('appBody').className = `theme-${code} flex flex-col items-center min-h-screen pb-12 transition-colors duration-300`;
            document.getElementById('mainHeader').style.backgroundColor = primaryColor;
            document.getElementById('networkImg').src = logoUrl;
            document.getElementById('inputUserIcon').style.color = primaryColor;
            document.getElementById('phoneInputBorder').style.borderColor = primaryColor;
            document.getElementById('heartIcon').style.color = primaryColor;
            document.getElementById('mainTabsBar').style.backgroundColor = lightColor;
            document.getElementById('payBalanceBtn').style.backgroundColor = primaryColor;
            document.getElementById('submitGomlaBtn').style.backgroundColor = primaryColor;
            
            document.querySelectorAll('.sub-tab').forEach(b => {
                b.style.backgroundColor = 'transparent';
                b.style.color = '#334155';
            });
            const activeBtn = document.getElementById('packagesMainTabBtn');
            if (activeBtn) {
                activeBtn.style.backgroundColor = primaryColor;
                activeBtn.style.color = '#ffffff';
            }
        }

        // دالة الفرز والتصفية الديناميكية المتقدمة (تعمل تماماً مثل الصورة)
        function renderCompanyLayout() {
            const container = document.getElementById('dynamicCompanyView');
            const subFilterRow = document.getElementById('subFilterRow');
            
            let filteredList = ALL_PACKAGES;
            let companyKeyName = "";

            if (currentCompanyCode === 'you') {
                companyKeyName = 'MTN';
                filteredList = ALL_PACKAGES.filter(p => (p.company || '').includes('MTN') || (p.company_ar || '').includes('يو'));
            } else if (currentCompanyCode === 'saba') {
                companyKeyName = 'Sabafon';
                filteredList = ALL_PACKAGES.filter(p => (p.company || '').includes('Sabafon') || (p.company_ar || '').includes('سبأفون'));
            } else if (currentCompanyCode === 'why') {
                companyKeyName = 'Y';
                filteredList = ALL_PACKAGES.filter(p => (p.company || '').includes('Y') || (p.company_ar || '').includes('واي'));
            } else if (currentCompanyCode === 'yem4g') {
                companyKeyName = 'Yem4g';
                filteredList = ALL_PACKAGES.filter(p => (p.company || '').includes('4G') || (p.company_ar || '').includes('يمن فورجي'));
            } else {
                companyKeyName = 'Yemen Mobile';
                filteredList = ALL_PACKAGES.filter(p => (p.company || '').includes('Yemen Mobile') || (p.company_ar || '').includes('يمن موبايل'));
            }

            // تطبيق الفلتر الفرعي إذا تم اختياره (دفع مسبق / فوترة / 4G)
            if (currentSubFilter === 'دفع مسبق') {
                filteredList = filteredList.filter(p => (p.payment_type || '').includes('دفع مسبق'));
            } else if (currentSubFilter === 'فوترة') {
                filteredList = filteredList.filter(p => (p.payment_type || '').includes('فوترة'));
            } else if (currentSubFilter === '4G') {
                filteredList = filteredList.filter(p => (p.category || '').includes('فورجي') || (p.name_ar || '').includes('فورجي'));
            }

            // رسم شريط الفلاتر الفرعية العلوي للباقات
            subFilterRow.className = "flex justify-center gap-1.5 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm text-xs font-bold";
            subFilterRow.innerHTML = `
                <button onclick="applySubFilter('4G', this)" class="sub-flt px-4 py-1.5 rounded-xl border border-slate-200 transition ${currentSubFilter==='4G'?'bg-amber-500 text-white shadow':''}">4G-فورجي</button>
                <button onclick="applySubFilter('فوترة', this)" class="sub-flt px-4 py-1.5 rounded-xl border border-slate-200 transition ${currentSubFilter==='فوترة'?'bg-amber-500 text-white shadow':''}">فوترة</button>
                <button onclick="applySubFilter('دفع مسبق', this)" class="sub-flt px-4 py-1.5 rounded-xl border border-slate-200 transition ${currentSubFilter==='دفع مسبق'?'bg-amber-50 text-white shadow':''}">دفع مسبق</button>
                <button onclick="applySubFilter('all', this)" class="sub-flt px-3 py-1.5 rounded-xl border border-slate-200 transition ${currentSubFilter==='all'?'bg-amber-500 text-white shadow':''}">الكل</button>
            `;

            // استخراج التصنيفات (Categories) ديناميكياً من الباقات المستلمة من السيرفر
            const categories = [...new Set(filteredList.map(p => p.category))];

            if (categories.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center border border-slate-200 text-xs font-bold text-slate-400">لا توجد باقات مطابقة لهذا التصفية في قاعدة البيانات</div>`;
                return;
            }

            // رسم الأكورديون (القوائم المنسدلة) لكل تصنيف تماماً كالصورة المطلوبة
            const primaryColorHex = document.getElementById('mainHeader').style.backgroundColor;
            
            container.innerHTML = categories.map((cat, idx) => {
                const catPackages = filteredList.filter(p => p.category === cat);
                return `
                    <div class="rounded-2xl overflow-hidden border border-amber-200/80 shadow-sm bg-[${document.getElementById('mainTabsBar').style.backgroundColor}]">
                        <button onclick="toggleAccordion('acc-${idx}', this)" class="w-full text-amber-950 p-3.5 flex justify-between items-center text-xs font-black">
                            <i class="fa-solid fa-chevron-down text-amber-800 transition-transform duration-300"></i>
                            <span class="text-xs font-bold text-amber-950">${cat} (${catPackages.length})</span>
                            <div class="w-6 h-6 rounded-full border border-amber-500/50 flex items-center justify-center p-0.5 bg-amber-100 text-[9px] font-black">${currentCompanyCode.toUpperCase()}</div>
                        </button>
                        <div id="acc-${idx}" class="p-2 space-y-2 hidden bg-white/70">
                            ${renderPackageCards(catPackages)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderPackageCards(pkgs) {
            return pkgs.map(pkg => {
                const price = pkg.price || pkg.amount || 0;
                return `
                    <div onclick='openPackageSheet(${JSON.stringify(pkg).replace(/'/g, "&apos;")})' class="bg-white hover:bg-amber-50 border border-amber-200/60 rounded-xl p-3 relative cursor-pointer shadow-sm active:scale-98 transition flex justify-between items-center">
                        <div class="text-right flex-1">
                            <h4 class="text-xs font-black text-slate-800">${pkg.name_ar || pkg.name_en}</h4>
                            <p class="text-[10px] text-slate-500 font-bold mt-0.5">${pkg.payment_type || 'دفع مسبق'} | ${pkg.line_type || 'شريحة'}</p>
                        </div>
                        <div class="text-left mr-3">
                            <span class="font-black text-base text-amber-900 block">${price}</span>
                            <span class="text-[9px] text-slate-400 font-bold">ريال يمني</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function applySubFilter(filterVal, btn) {
            currentSubFilter = filterVal;
            renderCompanyLayout();
        }

        function toggleAccordion(id, btn) {
            const target = document.getElementById(id);
            const icon = btn.querySelector('i');
            target.classList.toggle('hidden');
            if (icon) {
                icon.style.transform = target.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
            }
        }

        function changeMainTab(tabName, btn) {
            document.querySelectorAll('.sub-tab').forEach(b => {
                b.style.backgroundColor = 'transparent';
                b.style.color = '#334155';
            });
            btn.style.backgroundColor = document.getElementById('mainHeader').style.backgroundColor;
            btn.style.color = '#ffffff';

            document.getElementById('packagesSection').classList.add('hidden');
            document.getElementById('balanceSection').classList.add('hidden');
            document.getElementById('billSection').classList.add('hidden');
            document.getElementById('gomlaSection').classList.add('hidden');
            document.getElementById('subFilterRow').classList.add('hidden');

            if (tabName === 'packages') {
                document.getElementById('packagesSection').classList.remove('hidden');
                document.getElementById('subFilterRow').classList.remove('hidden');
            }
            if (tabName === 'balance') document.getElementById('balanceSection').classList.remove('hidden');
            if (tabName === 'bill') document.getElementById('billSection').classList.remove('hidden');
            if (tabName === 'gomla' || tabName === 'rial') {
                document.getElementById('gomlaSection').classList.remove('hidden');
                document.getElementById('quantityLabel').innerText = tabName === 'gomla' ? '* ادخل الكمية' : '* ادخل الكمية (ريال)';
            }
        }

        function renderQuickCards() {
            const container = document.getElementById('quickCardsContainer');
            const amounts = [200, 400, 600, 800, 1000, 1200];
            container.innerHTML = amounts.map(amt => {
                const total = Math.round(amt * 1.21);
                return `
                    <div onclick="openOrderModal('شحن فوري فئة ${amt}', ${total})" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden text-center cursor-pointer hover:border-slate-400 active:scale-95 transition">
                        <div class="bg-[${document.getElementById('mainHeader').style.backgroundColor}] text-white py-1.5 font-black text-base">${amt}</div>
                        <div class="p-1.5 text-xs font-black text-slate-800">${total} ريال</div>
                        <div class="bg-amber-50 text-slate-700 text-[10px] font-bold py-0.5">${amt / 200} يوم</div>
                    </div>
                `;
            }).join('');
        }

        function selectRechargeAmount(val) {
            document.getElementById('directBalanceInput').value = val;
            updateBalanceNet(val);
        }

        function clearInput() {
            document.getElementById('mobileNumber').value = '';
            document.getElementById('charCount').innerText = '0';
        }

        function openPackageSheet(pkg) {
            selectedPackage = pkg;
            const price = pkg.price || pkg.amount || 0;
            document.getElementById('sheetPackageTitle').innerText = pkg.name_ar || pkg.name_en;
            document.getElementById('sheetPackagePrice').innerText = price;
            document.getElementById('sheetNetPrice').innerText = (price / 1.195).toFixed(2);
            document.getElementById('sheetConfirmBtn').style.backgroundColor = document.getElementById('mainHeader').style.backgroundColor;
            document.getElementById('packageBottomSheet').classList.remove('hidden');
        }

        function closeBottomSheet() {
            document.getElementById('packageBottomSheet').classList.add('hidden');
        }

        function triggerOrderFromSheet(actionType) {
            closeBottomSheet();
            openOrderModal(selectedPackage.name_ar || selectedPackage.name_en, selectedPackage.price || selectedPackage.amount || 0);
        }

        function openOrderModal(name, price) {
            const phone = document.getElementById('mobileNumber').value;
            document.getElementById('confirmCompany').innerText = currentCompanyCode.toUpperCase();
            document.getElementById('confirmCategory').innerText = name;
            document.getElementById('confirmPhone').innerText = phone;
            document.getElementById('costInWords').innerText = `* اجمالي التكلفة : ${price} ريال`;
            document.getElementById('receivedAmountInput').value = price;
            document.getElementById('orderConfirmationModal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('orderConfirmationModal').classList.add('hidden');
        }

        function pressKey(key) {
            const input = document.getElementById('receivedAmountInput');
            if (key === 'clear') input.value = '';
            else input.value += key;
        }

        async function sendFinalOrder() {
            const phone = document.getElementById('mobileNumber').value;
            closeConfirmModal();

            try {
                let url = "";
                if (currentCompanyCode === 'ym') url = `/api/provider/yemen-mobile?action=billoffer&mobile=${phone}&offerkey=${selectedPackage?.package_code || '101'}&method=New`;
                else if (currentCompanyCode === 'you') url = `/api/provider/you/bill?isOffer=true&mobile=${phone}&num=${selectedPackage?.package_code || selectedPackage?.amount}`;
                else if (currentCompanyCode === 'saba') url = `/api/provider/sabaphone?type=offer&mobile=${phone}&num=${selectedPackage?.package_code}`;
                else if (currentCompanyCode === 'why') url = `/api/provider/why?mobile=${phone}&num=${selectedPackage?.price}`;
                else if (currentCompanyCode === 'yem4g') url = `/api/provider/yem4g?action=bill&mobile=${phone}&amount=${selectedPackage?.price}&type=1`;

                const res = await fetch(url);
                const data = await res.json();
                alert(data.success ? `✅ تم الطلب بنجاح:\n${data.data?.resultDesc || 'تم تنفيذ العملية بنجاح'}` : `❌ فشل الطلب: ${data.message || data.error}`);
            } catch (e) {
                alert(`⚠️ خطأ في الاتصال بالسيرفر: ${e.message}`);
            }
        }

        function toggleBalance() {
            isBalanceOpen = !isBalanceOpen;
            document.getElementById('balanceDisplay').innerText = isBalanceOpen ? "4520.50" : "*****";
        }

        function refreshBalance() {
            const icon = document.getElementById('refreshIcon');
            icon.classList.add('animate-spin');
            setTimeout(() => {
                isBalanceOpen = true;
                document.getElementById('balanceDisplay').innerText = "4520.50";
                icon.classList.remove('animate-spin');
            }, 600);
        }

        function updateBalanceNet(val) {
            document.getElementById('directBalanceNet').value = val ? (val / 1.195).toFixed(2) : '';
        }

        function shareViaWhatsapp() {
            const phone = document.getElementById('mobileNumber').value;
            window.open(`https://api.whatsapp.com/send?text=طلب رصيد/باقة للرقم ${phone}`, '_blank');
        }

        function shareViaSMS() {
            const phone = document.getElementById('mobileNumber').value;
            window.open(`sms:${phone}?body=طلب خدمات ذكية`, '_blank');
        }

        function queryPhoneNumber() {
            alert('🔍 جاري الاستعلام عن الرقم عبر السيرفر...');
        }

        function payDirectBalance() {
            const amt = document.getElementById('directBalanceInput').value;
            if(!amt) { alert('الرجاء إدخال المبلغ'); return; }
            openOrderModal(`شحن رصيد مباشر بقيمة ${amt}`, amt);
        }

        function submitGomla() {
            const qty = document.getElementById('gomlaQty').value;
            if(!qty) { alert('الرجاء إدخال الكمية'); return; }
            openOrderModal(`شحن جملة بقيمة ${qty}`, qty);
        }
    </script>
</body>
</html>
