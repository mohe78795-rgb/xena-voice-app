<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصل الشبوك - معجم لتسويق الدواجن</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* التوهج الذهبي الأصفر */
    .yellow-glow {
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
      background: linear-gradient(135deg, #713f12 0%, #422006 100%);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-neutral-950 font-sans min-h-screen text-white flex flex-col justify-between pb-20 select-none">

  <!-- ==================== 1. الهيدر العلوي (أصفر وأبيض) ==================== -->
  <header class="sticky top-0 z-40 bg-neutral-900/90 backdrop-blur-md border-b border-yellow-500/30 px-4 py-3 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      
      <!-- شعار وعنوان المكتب -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 font-bold text-lg shadow-inner">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white tracking-wide flex items-center gap-1.5">
            معجم لتسويق الدواجن
          </h1>
          <p class="text-[11px] text-yellow-400 font-medium">نظام محصل الشبوك الفارغة</p>
        </div>
      </div>

      <!-- مؤشر الاتصال بالسيرفر -->
      <div class="flex items-center gap-2">
        <span id="serverStatus" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-semibold bg-yellow-500/10 text-yellow-400 border border-yellow-500/40">
          <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse"></span>
          مربوط
        </span>
      </div>

    </div>
  </header>

  <!-- ==================== 2. محتوى الصفحة الرئيسية ==================== -->
  <main class="max-w-md mx-auto w-full px-4 py-4 space-y-4 flex-1">

    <!-- شريط البحث السريع -->
    <div class="relative">
      <input type="text" id="searchInput" oninput="filterCustomers()" placeholder="ابحث باسم الزبون أو رقم الهاتف..." 
             class="w-full bg-neutral-900 border border-neutral-800 pl-4 pr-10 py-3 rounded-2xl text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-yellow-500 transition shadow-inner">
      <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-yellow-400 text-sm"></i>
    </div>

    <!-- قائمة الزبائن المربوطة بقاعدة البيانات -->
    <div id="customersContainer" class="space-y-4">
      <div class="text-center py-10 text-yellow-400/80">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
        <p class="text-xs text-white">جاري الاتصال بقاعدة البيانات...</p>
      </div>
    </div>

  </main>

  <!-- ==================== 3. الأزرار السفلية الثلاثة (أصفر وأبيض) ==================== -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-neutral-900/95 backdrop-blur-lg border-t border-yellow-500/30 py-2 px-6 shadow-2xl">
    <div class="max-w-md mx-auto flex justify-between items-center">

      <!-- 1. الرئيسية -->
      <button onclick="switchTab('home')" id="tab-home" class="flex flex-col items-center gap-1 text-yellow-400 font-semibold transition group">
        <div class="w-10 h-8 rounded-xl bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 group-hover:scale-110 transition">
          <i class="fa-solid fa-house text-sm"></i>
        </div>
        <span class="text-[11px] text-white">الرئيسية</span>
      </button>

      <!-- 2. الرسائل -->
      <button onclick="switchTab('messages')" id="tab-messages" class="flex flex-col items-center gap-1 text-neutral-400 hover:text-yellow-400 transition group">
        <div class="relative w-10 h-8 rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center text-white group-hover:scale-110 transition">
          <i class="fa-solid fa-comments text-sm"></i>
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-yellow-500 text-neutral-950 text-[9px] font-bold rounded-full flex items-center justify-center border border-neutral-900">3</span>
        </div>
        <span class="text-[11px] text-white">الرسائل</span>
      </button>

      <!-- 3. التنبيهات -->
      <button onclick="switchTab('notifications')" id="tab-notifications" class="flex flex-col items-center gap-1 text-neutral-400 hover:text-yellow-400 transition group">
        <div class="relative w-10 h-8 rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center text-white group-hover:scale-110 transition">
          <i class="fa-solid fa-bell text-sm"></i>
          <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-yellow-400 rounded-full border border-neutral-900 animate-pulse"></span>
        </div>
        <span class="text-[11px] text-white">التنبيهات</span>
      </button>

    </div>
  </nav>

  <!-- ==================== البرمجة والربط بالسيرفر ==================== -->
  <script>
    // مسار الـ API المباشر لخدمتك على Render
    const API_URL = '/api/zoe';
    let allCustomers = [];

    // 1. جلب البيانات من السيرفر وقاعدة البيانات عند فتح التطبيق
    async function fetchCustomersFromDB() {
      const container = document.getElementById('customersContainer');
      try {
        const res = await fetch(API_URL);
        const result = await res.json();

        if (result.success) {
          allCustomers = result.data || [];
          renderCustomers(allCustomers);
        } else {
          container.innerHTML = `
            <div class="text-center py-10 text-rose-400">
              <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
              <p class="text-xs text-white">خطأ في استجابة السيرفر: ${result.message}</p>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-10 text-rose-400">
            <i class="fa-solid fa-wifi text-2xl mb-2"></i>
            <p class="text-xs text-white">فشل الاتصال بالسيرفر. تأكد من تشغيل الخادم.</p>
          </div>
        `;
      }
    }

    // 2. عرض كروت الزبائن بالأصفر والأبيض
    function renderCustomers(list) {
      const container = document.getElementById('customersContainer');
      
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-neutral-400">
            <i class="fa-solid fa-box-open text-3xl mb-2 text-yellow-500"></i>
            <p class="text-xs text-white">لا يوجد زبائن مسجلين في قاعدة البيانات</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(c => {
        const previousCrates = c.crates_balance?.previous_debt || 0;
        const todayCrates = c.crates_balance?.today_delivered || 0;
        const totalRemaining = c.crates_balance?.remaining_debt || (previousCrates + todayCrates);
        const mapsUrl = c.location?.google_maps_url || `https://maps.google.com/?q=13.9800,45.5700`;

        return `
          <div class="bg-neutral-900 border border-yellow-500/30 rounded-3xl p-4 shadow-xl space-y-4 relative overflow-hidden">
            
            <!-- الهيدر: اسم ورقم الزبون وأزرار التواصل/الخريطة -->
            <div class="flex items-start justify-between pb-3 border-b border-neutral-800">
              <div class="space-y-1">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                  <i class="fa-solid fa-store text-yellow-400 text-xs"></i> ${c.name}
                </h2>
                <div class="flex items-center gap-3 text-xs text-white/80 font-mono">
                  <span><i class="fa-solid fa-phone text-[10px] text-yellow-400 ml-1"></i>${c.phone}</span>
                </div>
              </div>

              <!-- أزرار اتصال سريع وخريطة باللون الأصفر والأبيض -->
              <div class="flex items-center gap-1.5">
                <a href="tel:${c.phone}" class="w-8 h-8 rounded-xl bg-neutral-800 border border-yellow-500/40 flex items-center justify-center text-yellow-400 text-xs transition hover:bg-yellow-500 hover:text-neutral-950">
                  <i class="fa-solid fa-phone"></i>
                </a>
                <a href="${mapsUrl}" target="_blank" class="w-8 h-8 rounded-xl bg-neutral-800 border border-yellow-500/40 flex items-center justify-center text-yellow-400 text-xs transition hover:bg-yellow-500 hover:text-neutral-950" title="فتح الموقع في الخريطة">
                  <i class="fa-solid fa-location-dot"></i>
                </a>
              </div>
            </div>

            <!-- تفاصيل الشبوك (سابق - اليوم - إجمالي) بالأصفر والأبيض -->
            <div class="grid grid-cols-3 gap-2 text-center">
              <div class="bg-neutral-950 p-2.5 rounded-2xl border border-neutral-800">
                <span class="block text-[10px] text-white/70 mb-0.5">شبوك سابقة</span>
                <span class="text-sm font-bold text-white font-mono">${previousCrates}</span>
              </div>
              <div class="bg-neutral-950 p-2.5 rounded-2xl border border-neutral-800">
                <span class="block text-[10px] text-yellow-400 mb-0.5">معه اليوم</span>
                <span class="text-sm font-bold text-yellow-400 font-mono">+${todayCrates}</span>
              </div>
              <div class="yellow-glow p-2.5 rounded-2xl border border-yellow-500/50">
                <span class="block text-[10px] text-yellow-300 mb-0.5 font-semibold">إجمالي الشبوك</span>
                <span class="text-base font-black text-white font-mono tracking-wider">${totalRemaining}</span>
              </div>
            </div>

            <!-- حقل استلام شباك فارغ واحد مربوط مع السيرفر -->
            <form onsubmit="handleReceiveCrates(event, '${c.name}', '${c.phone}', '${mapsUrl}')" class="pt-1 flex gap-2">
              <div class="relative flex-1">
                <input type="number" id="input_crates_${c.phone}" min="1" max="${totalRemaining}" placeholder="عدد الشبوك المستلمة..." required
                       class="w-full bg-neutral-950 border border-neutral-800 p-2.5 pr-8 rounded-xl text-xs text-white focus:outline-none focus:border-yellow-500 font-mono">
                <i class="fa-solid fa-box-archive absolute right-3 top-3 text-yellow-400 text-xs"></i>
              </div>

              <button type="submit" id="btn_submit_${c.phone}" class="bg-yellow-500 hover:bg-yellow-400 text-neutral-950 font-bold px-4 rounded-xl text-xs transition shadow-lg shadow-yellow-500/20 flex items-center gap-1.5 shrink-0">
                <i class="fa-solid fa-check"></i> استلام
              </button>
            </form>

          </div>
        `;
      }).join('');
    }

    // 3. إرسال عملية استلام الشبوك للسيرفر والتحديث في قاعدة البيانات
    async function handleReceiveCrates(event, customerName, customerPhone, mapUrl) {
      event.preventDefault();

      const inputEl = document.getElementById(`input_crates_${customerPhone}`);
      const btnEl = document.getElementById(`btn_submit_${customerPhone}`);
      const amount = Number(inputEl.value);

      if (!amount || amount <= 0) return;

      btnEl.disabled = true;
      btnEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...`;

      // تجهيز البيانات للإرسال لحفظ الإرجاع في السيرفر
      const payload = {
        name: customerName,
        phone: customerPhone,
        google_maps_url: mapUrl,
        total_delivered: 0,
        total_returned: amount // إرسال عدد الشبوك المرجعة
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert(`تم استلام ${amount} صندوق فارغ من (${customerName}) وحفظ التحديث بقاعدة البيانات بنجاح!`);
          fetchCustomersFromDB(); // إعادة جلب البيانات فوراً للحصول على الأرقام الدقيقة
        } else {
          alert('خطأ من السيرفر: ' + result.message);
        }
      } catch (err) {
        alert('فشل الاتصال بالسيرفر لتحديث البيانات!');
      } finally {
        btnEl.disabled = false;
        btnEl.innerHTML = `<i class="fa-solid fa-check"></i> استلام`;
      }
    }

    // 4. فلترة وتصفية الزبائن
    function filterCustomers() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allCustomers.filter(c => 
        (c.name && c.name.toLowerCase().includes(query)) || 
        (c.phone && c.phone.includes(query))
      );
      renderCustomers(filtered);
    }

    // 5. التنقل بين الأزرار السفلية
    function switchTab(tabName) {
      const tabs = ['home', 'messages', 'notifications'];
      tabs.forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (t === tabName) {
          el.className = "flex flex-col items-center gap-1 text-yellow-400 font-semibold transition group";
          el.querySelector('div').className = "w-10 h-8 rounded-xl bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 group-hover:scale-110 transition";
        } else {
          el.className = "flex flex-col items-center gap-1 text-neutral-400 hover:text-yellow-400 transition group";
          el.querySelector('div').className = "relative w-10 h-8 rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center text-white group-hover:scale-110 transition";
        }
      });

      if (tabName !== 'home') {
        alert(`قسم ${tabName === 'messages' ? 'الرسائل' : 'التنبيهات'} قيد التحديث.`);
      }
    }

    // التشغيل التلقائي فور التحميل
    window.onload = () => {
      fetchCustomersFromDB();
    };
  </script>
</body>
</html>
