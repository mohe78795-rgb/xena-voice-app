<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجم لتربية وتسويق الدواجن - النظام الشامل</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background-color: #0b101b; color: #f3f4f6; margin: 0; padding: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0b101b] text-gray-100 flex flex-col min-h-screen m-0 p-0">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="w-full min-h-screen bg-[#0d111a] flex items-center justify-center p-4">
        <div class="w-full max-w-xl bg-[#111827] rounded-3xl p-6 md:p-10 shadow-2xl border border-slate-800 flex flex-col justify-center">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-700 p-2">
                    <img src="https://i.postimg.cc/DWtX86v7/logo.png" alt="شعار" class="w-full h-full object-contain">
                </div>
                <h1 class="text-xl font-bold text-white mb-1">معجم لتربية وتسويق الدواجن</h1>
                <p class="text-[11px] text-yellow-400 font-semibold">الجمهورية اليمنية - محافظة البيضاء</p>
            </div>

            <form id="loginForm" class="space-y-4 max-w-md mx-auto w-full" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">اسم المستخدم / رقم الهاتف</label>
                    <input type="text" id="username" required class="w-full bg-[#0d111a] border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="أدخل رقم الهاتف أو اسم المستخدم">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full bg-[#0d111a] border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-yellow-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-3.5 rounded-xl text-sm shadow-lg">
                    تسجيل الدخول للنظام
                </button>
            </form>

            <div class="mt-6 text-center border-t border-slate-800 pt-5 max-w-md mx-auto w-full">
                <button onclick="document.getElementById('registerModal').classList.remove('hidden')"
                    class="w-full bg-slate-800 hover:bg-slate-700 text-yellow-400 font-bold py-3.5 rounded-xl text-xs border border-slate-700">
                    إنشاء حساب جديد (مسوق مزارع / موظف)
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة إنشاء حساب جديد -->
    <div id="registerModal" class="hidden fixed inset-0 bg-[#0d111a] flex flex-col items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="w-full max-w-md bg-[#0f172a] rounded-2xl p-6 shadow-2xl relative border border-slate-800">
            <button onclick="document.getElementById('registerModal').classList.add('hidden')" class="absolute top-4 left-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-lg font-bold text-yellow-400 mb-4 text-center">إنشاء حساب جديد</h2>
            <form id="registerForm" class="space-y-3" onsubmit="handleRegister(event)">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">الاسم الكامل</label>
                    <input type="text" id="regName" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">رقم الهاتف</label>
                    <input type="text" id="regPhone" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">كلمة السر</label>
                    <input type="password" id="regPassword" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs text-yellow-400 mb-1 font-bold">الوظيفة المعتمدة:</label>
                    <select id="regRole" required class="w-full bg-[#131c31] border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                        <option value="" disabled selected>-- اختر الوظيفة --</option>
                        <option value="marketer">مسوق مزارع</option>
                        <option value="warehouse">مدير مخازن</option>
                        <option value="admin">مدير عام (Admin)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold py-3 rounded-xl text-sm mt-3">
                    تسجيل الحساب
                </button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboardScreen" class="hidden w-full min-h-screen bg-[#0d111a] p-3 md:p-6 flex flex-col justify-between">
        <div class="w-full flex-1 flex flex-col">
            <div class="w-full border-b border-slate-800 pb-3 mb-4 bg-[#161f32]/60 px-4 py-3 rounded-2xl flex justify-between items-center">
                <div>
                    <h2 class="text-sm md:text-base font-bold text-white">معجم لتربية وتسويق الدواجن</h2>
                    <p class="text-[10px] text-yellow-400">الجمهورية اليمنية - محافظة البيضاء</p>
                </div>
                <div id="userWelcomeBadge" class="text-xs text-yellow-400 font-bold bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700"></div>
            </div>

            <!-- حاوية عرض التبويبات -->
            <div id="tabContentContainer" class="w-full flex-1 flex items-center justify-center custom-scrollbar"></div>
        </div>

        <!-- شريط التنقل السفلي -->
        <div class="w-full mt-4 pt-2 border-t border-slate-800 grid grid-cols-4 gap-1 bg-[#111827] p-2 rounded-2xl border border-slate-800 text-center shadow-lg">
            <button onclick="switchTab('home')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-yellow-400" data-nav="home"><i class="fa-solid fa-house text-base"></i><span class="text-[10px] mt-1">رئيسية</span></button>
            <button onclick="switchTab('marketShipment')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="marketShipment"><i class="fa-solid fa-truck-ramp-box text-base"></i><span class="text-[10px] mt-1">مسؤول مزارع</span></button>
            <button onclick="switchTab('account')" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-slate-400 hover:text-white" data-nav="account"><i class="fa-solid fa-user-gear text-base"></i><span class="text-[10px] mt-1">الحساب</span></button>
            <button onclick="logout()" class="bottom-nav-btn flex flex-col items-center justify-center p-1.5 rounded-xl transition text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket text-base"></i><span class="text-[10px] mt-1">خروج</span></button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) { loadDashboard(JSON.parse(savedUser)); }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    loadDashboard(data.user);
                } else {
                    alert(data.message || 'خطأ في بيانات الدخول');
                }
            } catch (err) {
                alert('خطأ في الاتصال بالخادم');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password, role })
                });
                const data = await response.json();
                if (data.success) {
                    alert('✅ تم إنشاء الحساب بنجاح!');
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    document.getElementById('registerModal').classList.add('hidden');
                    loadDashboard(data.user);
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال');
            }
        }

        function loadDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('userWelcomeBadge').innerText = `${user.name} (${user.role === 'marketer' ? 'مسوق مزارع' : user.role})`;
            
            if(user.role === 'marketer') {
                switchTab('marketShipment');
            } else {
                switchTab('home');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        function switchTab(tabName) {
            const container = document.getElementById('tabContentContainer');
            document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.remove('text-yellow-400'));

            if (tabName === 'home') {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">مرحباً بك في لوحة تحكم النظام.<br>انقر على تبويب (مسوق مزارع) بالأسفل لفتح وإدارة تقرير وارد الدجاج المرتبط بقاعدة البيانات.</div>`;
            } else if (tabName === 'marketShipment') {
                fetchMarketShipmentData();
            } else if (tabName === 'account') {
                const user = JSON.parse(localStorage.getItem('currentUser')) || {};
                container.innerHTML = `<div class="p-6 text-center text-slate-300"><h3>حساب المستخدم: ${user.name}</h3><p>الوظيفة: ${user.role}</p><p>الهاتف: ${user.phone}</p></div>`;
            }
        }

        // جلب وعرض واجهة "مسوق مزارع" وربطها بقاعدة البيانات
        async function fetchMarketShipmentData() {
            const container = document.getElementById('tabContentContainer');
            try {
                const response = await fetch('/api/market-shipment');
                const result = await response.json();
                if (result.success) {
                    container.innerHTML = getMarketShipmentUI(result.data);
                }
            } catch (err) {
                container.innerHTML = `<div class="text-red-400">خطأ في جلب بيانات التقرير من قاعدة البيانات.</div>`;
            }
        }

        function getMarketShipmentUI(data) {
            const rows = data.rows || {};
            const getVal = (type, field) => (rows[type] && rows[type][field] !== undefined) ? rows[type][field] : 0;

            const chickenTypes = [
                { key: 'كبير', label: 'كبير' },
                { key: 'مخورج', label: 'مخورج' },
                { key: 'متوسط', label: 'متوسط' },
                { key: 'مطاعم', label: 'مطاعم' },
                { key: 'صغير', label: 'صغير' },
                { key: 'جفش', label: 'جفش' }
            ];

            let rowsHtml = chickenTypes.map(item => {
                let boxes = getVal(item.key, 'boxes');
                let packing = getVal(item.key, 'packing');
                let price = getVal(item.key, 'price');
                let total = boxes * packing;

                return `
                    <tr class="chicken-row" data-type="${item.key}">
                        <td class="py-3 px-2 text-right font-medium truncate">${item.label}</td>
                        <td class="py-3 px-2">
                            <input type="number" value="${boxes}" class="boxes w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" oninput="calculateTotal(this)" onblur="updateRowField(this, 'boxes')">
                        </td>
                        <td class="py-3 px-2">
                            <input type="number" value="${packing}" class="packing w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" oninput="calculateTotal(this)" onblur="updateRowField(this, 'packing')">
                        </td>
                        <td class="py-3 px-2 text-[#facc15] font-bold total-chickens">${total}</td>
                        <td class="py-3 px-2 text-left">
                            <input type="number" value="${price}" class="price w-24 bg-[#0f172a] border border-[#1f293d] rounded-lg py-1.5 text-center text-white font-semibold focus:outline-none focus:border-[#facc15]" onblur="updateRowField(this, 'price')">
                        </td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="w-full max-w-5xl bg-[#111827] border border-[#1f293d] rounded-2xl p-6 shadow-2xl flex flex-col justify-between my-auto h-[88vh]">
                    <div>
                        <!-- رأس التقرير مع تحديث فوري للحقل عند مغادرته (onblur) -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-5 bg-[#0f172a] p-4 rounded-xl border border-[#1e293b]">
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">المزرعة:</label>
                                <input type="text" id="farmName" value="${data.farmName || ''}" onblur="updateField('farmName', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">بيانات الشحنة:</label>
                                <input type="text" id="shipmentDetails" value="${data.shipmentDetails || ''}" onblur="updateField('shipmentDetails', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">المسوق المسؤول:</label>
                                <input type="text" id="marketerName" value="${data.marketerName || ''}" onblur="updateField('marketerName', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">تاريخ الوارد:</label>
                                <input type="text" id="shipmentDate" value="${data.shipmentDate || ''}" onblur="updateField('shipmentDate', this.value)" class="w-full bg-[#111827] border border-[#1f293d] rounded-lg px-3 py-1.5 text-sm text-[#facc15] font-bold focus:outline-none focus:border-[#facc15]">
                            </div>
                        </div>

                        <!-- جدول البيانات -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-center border-collapse table-fixed">
                                <colgroup>
                                    <col style="width: 20%;">
                                    <col style="width: 20%;">
                                    <col style="width: 20%;">
                                    <col style="width: 20%;">
                                    <col style="width: 20%;">
                                </colgroup>
                                <thead>
                                    <tr class="text-[#facc15] text-sm border-b border-[#1f293d]">
                                        <th class="py-3 px-2 text-right">نوع الدجاج</th>
                                        <th class="py-3 px-2">عدد الصناديق</th>
                                        <th class="py-3 px-2">تعبئة الصندوق</th>
                                        <th class="py-3 px-2">إجمالي الدجاج</th>
                                        <th class="py-3 px-2 text-left">سعر البيع</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-[#1f293d]/50 text-sm text-gray-200" id="chickenTable">
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="mt-4 pt-2">
                        <button onclick="alert('✅ جميع التعديلات محفوظة تلقائياً في قاعدة البيانات (كولكشن market_shipments)')" class="w-full bg-[#facc15] hover:bg-[#eab308] text-gray-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg text-base cursor-pointer">
                            حالة الربط: متصل ومحدث تلقائياً بقاعدة البيانات
                        </button>
                    </div>
                </div>
            `;
        }

        function calculateTotal(element) {
            const row = element.closest('.chicken-row');
            const boxes = parseFloat(row.querySelector('.boxes').value) || 0;
            const packing = parseFloat(row.querySelector('.packing').value) || 0;
            const totalCell = row.querySelector('.total-chickens');
            totalCell.textContent = boxes * packing;
        }

        // دالة تحديث حقل الرأس في قاعدة البيانات فورا
        async function updateField(fieldName, fieldValue) {
            try {
                await fetch('/api/update-field', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fieldName, fieldValue })
                });
            } catch (err) {
                console.error('خطأ في تحديث الحقل:', err);
            }
        }

        // دالة تحديث صف الجدول (صناديق، تعبئة، سعر) في قاعدة البيانات فوراً عند مغادرة الحقل
        async function updateRowField(element, subField) {
            const row = element.closest('.chicken-row');
            const chickenType = row.getAttribute('data-type');
            const fieldValue = element.value;

            try {
                await fetch('/api/update-row-field', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chickenType, subField, fieldValue })
                });
            } catch (err) {
                console.error('خطأ في تحديث صف الجدول:', err);
            }
        }
    </script>
</body>
</html>
