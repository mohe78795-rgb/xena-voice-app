<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تتبع الشبوك - حسين حبشي</title>

  <!-- Tailwind CSS عبر CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS للخرائط -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- خط Tajawal لتصميم عربي احترافي -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap">

  <style>
    * {
      font-family: 'Tajawal', sans-serif;
    }
    /* جعل الخريطة ملء الشاشة بالكامل */
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* خريطة بثيم داكن وألوان نيون متناسقة */
    .leaflet-tile-pane {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }
    /* إخفاء عناصر التحكم الافتراضية للخرائط */
    .leaflet-control-container .leaflet-routing-container-hide {
      display: none;
    }
    /* تصميم مؤشر تخصيص الخريطة custom pulse marker */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marker-pin {
      width: 48px;
      height: 48px;
      border-radius: 50% 50% 50% 0;
      background: #f59e0b;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -24px 0 0 -24px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
      animation: bounce 2s infinite ease-in-out;
    }
    .marker-pin::after {
      content: '';
      width: 36px;
      height: 36px;
      margin: 6px 0 0 6px;
      background: #0f172a;
      position: absolute;
      border-radius: 50%;
    }
    .marker-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      position: absolute;
      z-index: 10;
      object-fit: cover;
      border: 2px solid #f59e0b;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-45deg); }
      50% { transform: translateY(-10px) rotate(-45deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden select-none">

  <!-- 1. الخريطة تغطي الشاشة بالكامل -->
  <div id="map"></div>

  <!-- 2. شريط الأدوات العلوي للهوية (Glassmorphism Navbar) -->
  <header class="absolute top-4 right-4 left-4 z-20 flex items-center justify-between pointer-events-none">
    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl px-5 py-3 shadow-2xl flex items-center gap-3 pointer-events-auto">
      <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400 text-xl shadow-lg">
        📦
      </div>
      <div>
        <h1 class="font-extrabold text-sm md:text-base text-white tracking-wide">نظام تتبع الشبوك والديون</h1>
        <p class="text-[11px] text-amber-400 font-medium">الفرع: البيضاء - اليمن</p>
      </div>
    </div>

    <!-- عداد إجمالي الحالات -->
    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-700/50 rounded-2xl px-4 py-2.5 shadow-2xl flex items-center gap-2 pointer-events-auto">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
      <span class="text-xs font-bold text-slate-200">1 عميل يمتلك شبوك فارغة</span>
    </div>
  </header>

  <!-- 3. لوحة تفاصيل العميل الجانبية Floating Card -->
  <aside class="absolute bottom-6 right-4 left-4 md:left-auto md:w-96 z-20 pointer-events-auto">
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4 transition-all duration-300">
      
      <!-- صورة الشبوك الفارغة + Badge -->
      <div class="relative h-44 rounded-2xl overflow-hidden border border-slate-700/50 group">
        <img 
          src="https://postimg.cc/YLWDNm8Z" 
          alt="الشبوك الفارغة" 
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
          onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1584473457406-6df3a637210c?q=80&w=600&auto=format&fit=crop';"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
        <div class="absolute top-3 right-3 bg-amber-500/90 backdrop-blur-md text-slate-950 font-black text-xs px-3 py-1.5 rounded-full shadow-lg flex items-center gap-1">
          <span>📦</span>
          <span>المتبقي: <strong id="cageNum" class="text-sm">6</strong> شبوك</span>
        </div>
      </div>

      <!-- المواصفات واسم الزبون -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-black text-white">حسين حبشي</h2>
          <span class="text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2.5 py-0.5 rounded-md">عميل دائم</span>
        </div>
        <p class="text-xs text-slate-400 flex items-center gap-1">
          <span>🏪</span>
          <span class="font-bold text-slate-300">احمد الحبشي للدواجن</span>
        </p>
      </div>

      <!-- الإحداثيات والموقع -->
      <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs text-slate-400 font-mono">
        <div class="flex items-center gap-1.5">
          <span class="text-amber-400">📍</span>
          <span>13.985184, 45.574288</span>
        </div>
        <button onclick="centerMap()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-amber-400 px-2 py-1 rounded transition">
          تركيز الخريطة
        </button>
      </div>

      <!-- أزرار التفاعل والإجراءات -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="decreaseCages()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black py-2.5 px-3 rounded-xl text-xs transition shadow-lg shadow-amber-500/10 flex items-center justify-center gap-1 active:scale-95">
          <span>استلام شبك (-1)</span>
        </button>
        <a href="https://maps.app.goo.gl/PVDHxv8XXFVzw61v5" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold py-2.5 px-3 rounded-xl text-xs transition flex items-center justify-center gap-1.5 active:scale-95">
          <span>توجيه الخريطة</span>
          <span>🗺️</span>
        </a>
      </div>

    </div>
  </aside>

  <!-- 4. JavaScript لتشغيل الخريطة والمؤشر -->
  <script>
    const lat = 13.985184;
    const lng = 45.574288;
    let cagesCount = 6;

    // تهيئة الخريطة على ملء الشاشة
    const map = L.map('map', {
      zoomControl: false
    }).setView([lat, lng], 16);

    // إضافة بلاطات الخريطة
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // إنشاء المؤشر المخصص المميز المضيء (Neon Custom Marker)
    const customIcon = L.divIcon({
      className: 'custom-marker',
      html: `
        <div class="marker-pin"></div>
        <img src="https://postimg.cc/YLWDNm8Z" class="marker-img" onerror="this.src='https://images.unsplash.com/photo-1584473457406-6df3a637210c?q=80&w=600&auto=format&fit=crop';" />
      `,
      iconSize: [48, 48],
      iconAnchor: [24, 48]
    });

    // إضافة المؤشر ورسالة Popup التفاعلية
    const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);

    const updatePopup = () => {
      marker.bindPopup(`
        <div style="direction: rtl; font-family: 'Tajawal', sans-serif; text-align: right; color: #0f172a;">
          <h3 style="font-weight: 800; font-size: 14px; margin: 0 0 4px 0;">حسين حبشي</h3>
          <p style="font-size: 11px; color: #64748b; margin: 0 0 6px 0;">احمد الحبشي للدواجن</p>
          <span style="background: #f59e0b; color: #0f172a; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 12px; inline-block;">
            📦 ${cagesCount} شبوك متبقية
          </span>
        </div>
      `).openPopup();
    };

    updatePopup();

    // دالة تقليل عدد الشبوك عند الاستلام
    function decreaseCages() {
      if (cagesCount > 0) {
        cagesCount--;
        document.getElementById('cageNum').innerText = cagesCount;
        updatePopup();
      } else {
        alert('تم استلام جميع الشبوك للعميل بنجاح!');
      }
    }

    // إعادة الخريطة إلى مركز الموقع
    function centerMap() {
      map.flyTo([lat, lng], 16, {
        animate: true,
        duration: 1.5
      });
    }
  </script>

</body>
</html>
