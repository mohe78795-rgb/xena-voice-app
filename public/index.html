<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الزبائن والمواقع - مكتب معجم لتسويق الدواجن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .digital-glow {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
    }
  </style>
</head>
<body class="bg-slate-900 font-sans min-h-screen text-slate-100 p-3 sm:p-6 flex items-center justify-center">

  <div class="w-full max-w-md bg-slate-800 p-5 sm:p-6 rounded-3xl border border-slate-700 shadow-2xl space-y-5">

    <!-- الهيدر والوصول السريع -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-boxes-packing text-emerald-400"></i> معجم لتسويق الدواجن
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">تسجيل حركة الصناديق الفارغة والمواقع</p>
      </div>

      <!-- زر قائمة أسماء الزبائن -->
      <button onclick="toggleCustomersMenu()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow flex items-center gap-2">
        <i class="fa-solid fa-users"></i> أسماء الزبائن
      </button>
    </div>

    <!-- قائمة منسدلة سريعة لأسماء الزبائن -->
    <div id="customersListMenu" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <span class="text-xs font-bold text-slate-300">قائمة الزبائن المسجلين</span>
        <button onclick="toggleCustomersMenu()" class="text-slate-400 hover:text-slate-200 text-sm">&times;</button>
      </div>
      <ul id="namesOnlyList" class="max-h-48 overflow-y-auto space-y-1.5 text-sm text-slate-200 divide-y divide-slate-700/50">
        <li class="py-1 text-slate-400 text-xs text-center">جاري تحميل الأسماء...</li>
      </ul>
    </div>

    <!-- النموذج -->
    <form id="customerCratesForm" class="space-y-4">

      <!-- الحقل 1: اسم الزبون -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم الزبون</label>
        <div class="relative flex gap-2">
          <input type="text" id="customer_name" required placeholder="أدخل اسم الزبون..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <button type="button" onclick="selectFromContacts()" title="اختر من جهات الاتصال" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 px-3.5 rounded-xl text-base transition flex items-center justify-center border border-slate-600 shrink-0">
            <i class="fa-solid fa-address-book"></i>
          </button>
        </div>
      </div>

      <!-- الحقل 2: رقم الهاتف -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">رقم هاتف الزبون</label>
        <div class="relative">
          <input type="tel" id="customer_phone" required placeholder="مثال: 770000000" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none dir-ltr text-right">
          <i class="fa-solid fa-phone absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
        </div>
      </div>

      <!-- الحقل 3: تحديد موقع المحل عبر Google Maps السريع -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">موقع محل الزبون (Google Maps)</label>
        
        <div class="space-y-2">
          <div class="flex gap-2">
            <!-- زر جلب الموقع الحالي GPS فوراً -->
            <button type="button" onclick="getCurrentLocationGPS()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold p-2.5 rounded-xl border border-emerald-600 transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-crosshairs text-emerald-300"></i> جلب موقعك الحالي
            </button>

            <!-- زر فتح Google Maps للتحديد السريع -->
            <button type="button" onclick="openGoogleMapsDirectly()" class="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white text-xs font-semibold p-2.5 rounded-xl border border-indigo-600 transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-map-marked-alt text-indigo-300"></i> فتح خرائط جوجل
            </button>
          </div>

          <!-- حقل رابط الخريطة -->
          <div class="relative">
            <input type="url" id="google_maps_url" placeholder="أو إلصق رابط Google Maps هنا..." class="w-full bg-slate-900 border border-slate-700 p-2.5 pr-8 rounded-xl text-xs text-white focus:ring-2 focus:ring-emerald-500 outline-none">
            <i class="fa-solid fa-link absolute right-3 top-3 text-slate-500 text-xs"></i>
          </div>
          <p id="locationStatus" class="text-[11px] text-slate-400 flex items-center gap-1 hidden"></p>
        </div>
      </div>

      <!-- الحقل 4: تسليم صناديق فارغة جديدة -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">تسليم صناديق فارغة اليوم (+)</label>
        <div class="relative">
          <input type="number" id="delivered_crates" value="0" min="0" oninput="calculateTotalGlow()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <i class="fa-solid fa-box-archive absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
        </div>
      </div>

      <!-- الحقل 5: إرجاع صناديق فارغة -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">إرجاع صناديق فارغة من الزبون (-)</label>
        <div class="relative">
          <input type="number" id="returned_crates" value="0" min="0" oninput="calculateTotalGlow()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
          <i class="fa-solid fa-rotate-left absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
        </div>
      </div>

      <!-- المربع الضوئي الرقمي لإجمالي المتبقي -->
      <div class="pt-1">
        <label class="block text-xs font-semibold text-slate-400 mb-2 text-center">إجمالي الصناديق المتبقية ذمة على الزبون</label>
        <div class="digital-glow rounded-2xl p-4 border border-emerald-500/40 text-center space-y-1">
          <div id="remaining_display" class="text-4xl font-black text-emerald-400 tracking-wider font-mono drop-shadow-[0_0_10px_rgba(52,211,153,0.8)]">
            0
          </div>
          <span class="text-[10px] text-emerald-300 uppercase tracking-widest font-semibold">صندوق فارغ</span>
        </div>
      </div>

      <!-- زر الحفظ والطباعة -->
      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up"></i> حفظ البيانات وطباعة الإيصال
      </button>

    </form>
  </div>

  <script>
    const API_URL = '/api/zoe';
    let previousDebt = 0;

    // 1. فتح تطبيق/موقع Google Maps مباشرة
    function openGoogleMapsDirectly() {
      window.open('https://www.google.com/maps', '_blank');
    }

    // 2. جلب الموقع الحالي فوراً عبر GPS وبناء رابط Google Maps
    function getCurrentLocationGPS() {
      const statusEl = document.getElementById('locationStatus');
      statusEl.classList.remove('hidden');
      statusEl.className = "text-[11px] text-indigo-400 flex items-center gap-1";
      statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري جلب الإحداثيات الدقيقة...`;

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            
            document.getElementById('google_maps_url').value = mapsUrl;
            statusEl.className = "text-[11px] text-emerald-400 flex items-center gap-1";
            statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> تم تحديد الموقع بنجاح!`;
          },
          (error) => {
            statusEl.className = "text-[11px] text-rose-400 flex items-center gap-1";
            statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> متعذر تحديد الموقع. تأكد من تفعيل الـ GPS.`;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        statusEl.className = "text-[11px] text-rose-400 flex items-center gap-1";
        statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ميزة تحديد الموقع غير مدعومة بجهازك.`;
      }
    }

    // 3. إظهار/إخفاء قائمة الأسماء
    async function toggleCustomersMenu() {
      const menu = document.getElementById('customersListMenu');
      menu.classList.toggle('hidden');

      if (!menu.classList.contains('hidden')) {
        fetchNamesOnly();
      }
    }

    // 4. جلب قائمة أسماء الزبائن
    async function fetchNamesOnly() {
      const listContainer = document.getElementById('namesOnlyList');
      try {
        const res = await fetch(API_URL);
        const result = await res.json();

        if (result.success && result.data.length > 0) {
          listContainer.innerHTML = result.data.map(c => `
            <li class="py-2 px-1 flex justify-between items-center hover:text-emerald-400 cursor-pointer rounded-lg hover:bg-slate-750 transition" 
                onclick="selectCustomer('${c.name}', '${c.phone}', '${c.location?.google_maps_url || ''}', ${c.crates_balance?.remaining_debt || 0})">
              <span><i class="fa-solid fa-user text-xs text-indigo-400 ml-2"></i>${c.name}</span>
              <span class="text-[11px] text-emerald-400 font-mono font-bold">${c.crates_balance?.remaining_debt || 0} صندوق</span>
            </li>
          `).join('');
        } else {
          listContainer.innerHTML = '<li class="py-2 text-slate-400 text-xs text-center">لا يوجد زبائن مسجلين.</li>';
        }
      } catch (err) {
        listContainer.innerHTML = '<li class="py-2 text-rose-400 text-xs text-center">خطأ في الاتصال بالسيرفر!</li>';
      }
    }

    // 5. اختيار زبون من القائمة
    function selectCustomer(name, phone, mapUrl, currentDebt) {
      document.getElementById('customer_name').value = name;
      document.getElementById('customer_phone').value = phone;
      document.getElementById('google_maps_url').value = mapUrl;

      previousDebt = Number(currentDebt) || 0;
      calculateTotalGlow();

      document.getElementById('customersListMenu').classList.add('hidden');
    }

    // 6. استيراد جهات الاتصال
    async function selectFromContacts() {
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const props = ['name', 'tel'];
          const contacts = await navigator.contacts.select(props, { multiple: false });
          
          if (contacts.length > 0) {
            const contact = contacts[0];
            if (contact.name && contact.name[0]) {
              document.getElementById('customer_name').value = contact.name[0];
            }
            if (contact.tel && contact.tel[0]) {
              document.getElementById('customer_phone').value = contact.tel[0].replace(/\s+/g, '');
            }
          }
        } catch (ex) {
          alert('تعذر الوصول لجهات الاتصال.');
        }
      } else {
        alert('ميزة استيراد جهات الاتصال غير مدعومة في متصفحك.');
      }
    }

    // 7. حساب المجموع الكلي
    function calculateTotalGlow() {
      const newDelivered = Number(document.getElementById('delivered_crates').value) || 0;
      const newReturned = Number(document.getElementById('returned_crates').value) || 0;
      const totalRemaining = previousDebt + newDelivered - newReturned;
      document.getElementById('remaining_display').innerText = totalRemaining;
    }

    // 8. طباعة الإيصال الحراري (80mm)
    function printCrateReceipt(data) {
      const printWindow = window.open('', '_blank', 'width=400,height=600');
      const htmlContent = `
        <!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="UTF-8">
          <title>إيصال حركة صناديق - ${data.customerName}</title>
          <style>
            @media print { @page { size: 80mm auto; margin: 0; } body { padding: 8px; } }
            body { font-family: sans-serif; width: 78mm; margin: 0 auto; padding: 8px; font-size: 12px; }
            .header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 6px; margin-bottom: 8px; }
            .header h2 { margin: 0; font-size: 15px; }
            .info-table, .crates-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
            .crates-table th, .crates-table td { border: 1px solid #000; padding: 5px; text-align: center; }
            .total-box { border: 2px solid #000; padding: 6px; text-align: center; font-weight: bold; font-size: 13px; margin-top: 8px; }
            .footer { text-align: center; margin-top: 10px; font-size: 10px; border-top: 1px dashed #000; padding-top: 5px; }
          </style>
        </head>
        <body>
          <div class="header">
            <h2>مكتب معجم لتسويق الدواجن</h2>
            <p style="margin:3px 0;">إيصال حركة صناديق فارغة</p>
            <p style="margin:0; font-size:10px;">التاريخ: ${new Date().toLocaleString('ar-YE')}</p>
          </div>
          <table class="info-table">
            <tr><td><strong>اسم الزبون:</strong> ${data.customerName}</td></tr>
            <tr><td><strong>رقم الهاتف:</strong> ${data.phone}</td></tr>
          </table>
          <table class="crates-table">
            <thead>
              <tr><th>البيان</th><th>العدد</th></tr>
            </thead>
            <tbody>
              <tr><td>صناديق سابقة</td><td>${data.previousBalance}</td></tr>
              <tr><td>مسلمة اليوم (+)</td><td>${data.delivered}</td></tr>
              <tr><td>مرجعة اليوم (-)</td><td>${data.returned}</td></tr>
            </tbody>
          </table>
          <div class="total-box">
            إجمالي المتبقي ذمة: ${data.totalRemaining} صندوق
          </div>
          <div class="footer">شكراً لتعاملكم معنا</div>
          <script>
            window.onload = function() { window.print(); setTimeout(() => { window.close(); }, 500); };
          <\/script>
        </body>
        </html>
      `;
      printWindow.document.open();
      printWindow.document.write(htmlContent);
      printWindow.document.close();
    }

    // 9. إرسال البيانات للسيرفر وطباعة الإيصال
    document.getElementById('customerCratesForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ والطباعة...`;

      const customerName = document.getElementById('customer_name').value;
      const customerPhone = document.getElementById('customer_phone').value;
      const deliveredVal = Number(document.getElementById('delivered_crates').value) || 0;
      const returnedVal = Number(document.getElementById('returned_crates').value) || 0;

      const payload = {
        name: customerName,
        phone: customerPhone,
        google_maps_url: document.getElementById('google_maps_url').value,
        total_delivered: deliveredVal,
        total_returned: returnedVal
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert('تم حفظ البيانات بنجاح!');

          // طباعة الإيصال الحراري
          printCrateReceipt({
            customerName: customerName,
            phone: customerPhone,
            previousBalance: result.meta?.previousBalance || previousDebt,
            delivered: deliveredVal,
            returned: returnedVal,
            totalRemaining: result.data.crates_balance.remaining_debt
          });

          // إعادة ضبط النموذج
          document.getElementById('customerCratesForm').reset();
          document.getElementById('google_maps_url').value = '';
          document.getElementById('locationStatus').classList.add('hidden');
          previousDebt = 0;
          calculateTotalGlow();
        } else {
          alert('خطأ من السيرفر: ' + result.message);
        }
      } catch (err) {
        alert('حدث خطأ أثناء الاتصال بالسيرفر!');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> حفظ البيانات وطباعة الإيصال`;
      }
    });
  </script>
</body>
</html>
