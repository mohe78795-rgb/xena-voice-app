<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة صوتية حية - أبو حسين</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0d1117; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 15px; background: #161b22; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        .room-title { font-size: 18px; font-weight: bold; color: #58a6ff; }
        .share-btn { background: #238636; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        
        /* شبكة الـ 5 ميكروفونات */
        .mics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 15px; width: 100%; max-width: 500px; margin-bottom: 20px; }
        .mic-slot { background: #21262d; border: 2px dashed #30363d; border-radius: 12px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: 0.3s; }
        .mic-slot.active { border-color: #238636; background: #1f382b; }
        .mic-avatar { width: 50px; height: 50px; background: #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 5px; }
        .mic-slot.active .mic-avatar { background: #238636; }
        .mic-name { font-size: 12px; color: #8b949e; }

        .logs { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 100%; max-width: 500px; flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; color: #8b949e; margin-bottom: 15px; }
        
        .controls { padding: 15px; background: #161b22; display: flex; justify-content: center; gap: 15px; border-top: 1px solid #30363d; }
        .btn { background: #f85149; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn.active { background: #238636; }
    </style>
</head>
<body>

    <div class="header">
        <div class="room-title" id="roomName">غرفة صوتية عامة</div>
        <button class="share-btn" onclick="shareRoom()">مشاركة الرابط 🔗</button>
    </div>

    <div class="main-content">
        <!-- 5 ميكروفونات -->
        <div class="mics-grid" id="micsContainer">
            <!-- سيتم إنشاؤها برمجياً -->
        </div>

        <div class="logs" id="logs">
            <div>النظام: تم تهيئة الغرفة بنجاح.</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="micToggleBtn" onclick="toggleMic()">فتح الميكروفون 🎤</button>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        const socket = io();
        let localStream = null;
        let isMicOn = false;
        const peers = {};

        // استخراج معرف الغرفة من الرابط أو إنشاء غرفة افتراضية
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || 'default-room';
        document.getElementById('roomName').innerText = `غرفة رقم: ${roomId}`;

        function addLog(text) {
            const logs = document.getElementById('logs');
            logs.innerHTML += `<div>${text}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        // بناء 5 ميكروفونات
        const micsContainer = document.getElementById('micsContainer');
        for (let i = 1; i <= 5; i++) {
            const slot = document.createElement('div');
            slot.className = 'mic-slot';
            slot.id = `mic-${i}`;
            slot.innerHTML = `
                <div class="mic-avatar">🎙️</div>
                <div class="mic-name">ميك ${i}</div>
            `;
            micsContainer.appendChild(slot);
        }

        function shareRoom() {
            const currentUrl = window.location.href.split('?')[0] + `?room=${roomId}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentUrl);
                alert('تم نسخ رابط الغرفة بنجاح! شاركه مع أصدقائك.');
            } else {
                prompt('انسخ الرابط:', currentUrl);
            }
        }

        socket.emit('join-room', roomId);
        addLog('النظام: تم دخول الغرفة.');

        async function toggleMic() {
            const btn = document.getElementById('micToggleBtn');
            const slot1 = document.getElementById('mic-1');

            if (!isMicOn) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    isMicOn = true;
                    btn.innerText = 'إيقاف الميكروفون 🔴';
                    btn.classList.add('active');
                    slot1.classList.add('active');
                    addLog('النظام: الميكروفون يعمل الآن، جاري البث...');

                    socket.on('user-connected', async (userId) => {
                        addLog(`النظام: انضم مستخدم جديد (${userId})`);
                        const peerConnection = createPeerConnection(userId);
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        socket.emit('offer', { target: userId, offer });
                    });

                } catch (err) {
                    addLog('خطأ: تعذر الوصول إلى الميكروفون.');
                    console.error(err);
                }
            } else {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                isMicOn = false;
                btn.innerText = 'فتح الميكروفون 🎤';
                btn.classList.remove('active');
                slot1.classList.remove('active');
                addLog('النظام: تم إيقاف الميكروفون.');
            }
        }

        function createPeerConnection(userId) {
            const pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { target: userId, candidate: event.candidate });
                }
            };

            pc.ontrack = (event) => {
                const remoteAudio = document.getElementById('remoteAudio');
                remoteAudio.srcObject = event.streams[0];
                addLog('النظام: تم استقبال صوت من المشاركين الآخرين بنجاح.');
            };

            peers[userId] = pc;
            return pc;
        }

        socket.on('offer', async (data) => {
            const pc = createPeerConnection(data.sender);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.emit('answer', { target: data.sender, answer });
            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }
        });

        socket.on('answer', async (data) => {
            const pc = peers[data.sender];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peers[data.sender];
            if (pc && data.candidate) {
                await pc.setRemoteDescription(new RTCIceCandidate(data.candidate));
            }
        });
    </script>
</body>
</html>
