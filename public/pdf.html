<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث الأرصدة</title><style>body{font-family:Arial;direction:rtl;background:#f4f7f5;max-width:1000px;margin:auto;padding:18px}button{padding:12px 18px;background:#087f5b;color:#fff;border:0;border-radius:8px;margin:8px;cursor:pointer}table{width:100%;background:#fff;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd}.changed{background:#fff4cc}.added{background:#e5faed}.msg{padding:12px;background:#fff;border-radius:8px;margin:10px 0}a{color:#087f5b}</style><a href="/">الرئيسية</a><h1>رفع PDF وتحديث الأرصدة</h1><input id="file" type="file" accept="application/pdf"><button id="preview">تحليل ومعاينة</button><button id="commit" disabled>اعتماد التحديث السحابي</button><div id="msg" class="msg">اختر ملف PDF نصيًا.</div><div id="summary"></div><table><thead><tr><th>الحالة</th><th>الرقم</th><th>العميل</th><th>الرصيد الجديد</th></tr></thead><tbody id="rows"></tbody></table><script>const $=x=>document.querySelector(x);let data=null;const money=x=>x==null?'غير مذكور':Number(x).toLocaleString('en-US');async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}$('#preview').onclick=async()=>{let f=$('#file').files[0];if(!f)return alert('اختر PDF');$('#msg').textContent='جارٍ التحليل...';try{data=await api('/api/pdf/preview',{method:'POST',body:(()=>{let x=new FormData();x.append('pdf',f);return x})()});$('#summary').textContent=`الوارد: ${data.summary.incoming} | جديد: ${data.summary.added} | متغير: ${data.summary.changed} | دون تغيير: ${data.summary.unchanged}`;$('#rows').innerHTML=data.records.map(r=>`<tr class="${r.status}"><td>${r.status}</td><td>${r.customer_id}</td><td>${r.customer_name}</td><td>${money(r.balance)}</td></tr>`).join('');$('#commit').disabled=false;$('#msg').textContent='تمت المعاينة؛ لم تُحفظ التغييرات بعد.'}catch(e){$('#msg').textContent=e.message}};$('#commit').onclick=async()=>{if(!data||!confirm('اعتماد الأرصدة ورفعها إلى MongoDB؟'))return;try{let r=await api('/api/pdf/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:data.file,records:data.records})});$('#msg').textContent=`تم رفع وتحديث ${r.updated} عميل في قاعدة البيانات السحابية.`;$('#commit').disabled=true}catch(e){$('#msg').textContent=e.message}}</script>
